<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识体系</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

/* ── Design Token ── */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --surface-glass: rgba(255,255,255,.72);
  --text: #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary: #aeaeb2;
  --accent: #0071e3;
  --accent-soft: #e8f2ff;
  --accent-glass: rgba(0,113,227,.08);
  --border: rgba(0,0,0,.06);
  --border-glass: rgba(255,255,255,.3);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 30px rgba(0,0,0,.08);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --star: #ff9f0a;
  --green: #30d158;
  --blue: #0071e3;
  --orange: #ff9f0a;
  --purple: #bf5af2;
  --navy: #5856d6;
  --transition: cubic-bezier(.25,.1,.25,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Inter','Noto Sans SC',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;height:100vh;overflow:hidden}
.app{display:flex;height:100vh;max-width:1440px;margin:0 auto}

/* ── Sidebar ── */
.sb{width:216px;flex-shrink:0;background:var(--surface-glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;position:relative}
.sb::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.02))}
.sb-h{padding:20px 16px 10px;border-bottom:1px solid var(--border)}
.sb-h h1{font-size:13px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;color:var(--text)}
.sb-h h1 span{font-size:15px}
.sb-n{flex:1;overflow-y:auto;padding:8px 0 16px}
.sb-n::-webkit-scrollbar{width:0}
.sb-g{font-size:10px;color:var(--text-tertiary);padding:12px 16px 4px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.sb-n button{display:flex;align-items:center;gap:8px;width:calc(100%-12px);margin:1px 6px;padding:7px 10px;border:none;background:transparent;cursor:pointer;border-radius:var(--radius-sm);transition:all .2s var(--transition);font-family:inherit;font-size:12.5px;color:var(--text-secondary);text-align:left;position:relative}
.sb-n button:hover{background:var(--accent-glass);color:var(--text)}
.sb-n button.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.sb-n button.active::before{content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:3px;height:16px;border-radius:2px;background:var(--accent)}
.sb-n button .si{font-size:13px;flex-shrink:0}

/* ── Main ── */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.mn-h{display:flex;align-items:center;gap:10px;padding:14px 20px 0 20px;flex-wrap:wrap;background:transparent}
.mn-h .vl{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;margin-right:12px;letter-spacing:-.15px;flex-shrink:0}
.mn-h .vl .c{font-size:11px;color:var(--text-secondary);font-weight:400;background:var(--border);padding:1px 8px;border-radius:10px}
.fr{display:flex;gap:3px;flex-wrap:wrap}
.fr button{padding:3px 10px;border-radius:20px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;font-size:11.5px;font-family:inherit;transition:all .2s var(--transition)}
.fr button:hover{background:var(--accent-glass);color:var(--accent)}
.fr button.active{background:var(--accent);color:#fff;font-weight:500;box-shadow:0 1px 4px rgba(0,113,227,.25)}

/* ── Content ── */
.ct{flex:1;overflow-y:auto;padding:14px 18px 24px;scroll-behavior:smooth}
.ct::-webkit-scrollbar{width:4px}
.ct::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── Glass Card ── */
.glass-card{background:var(--surface-glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:var(--radius-md);border:1px solid var(--border-glass);box-shadow:var(--shadow-sm);padding:14px 16px;cursor:pointer;transition:all .3s var(--transition)}
.glass-card:hover{box-shadow:var(--shadow-md);border-color:var(--border);transform:translateY(-2px)}
.glass-card .gc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.glass-card .gc-badge{font-size:9.5px;padding:2px 8px;border-radius:20px;background:var(--border);color:var(--text-tertiary);font-weight:500;letter-spacing:.2px}
.glass-card .gc-status{font-size:9.5px;padding:2px 8px;border-radius:20px;color:#fff;font-weight:500}
.glass-card h3{font-size:13px;font-weight:600;margin-bottom:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.glass-card .gc-meta{font-size:11px;color:var(--text-secondary);margin-bottom:2px}
.glass-card .gc-tags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.glass-card .gc-tag{font-size:9.5px;padding:1px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.glass-card .gc-excerpt{font-size:11.5px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;padding-top:4px;border-top:1px solid var(--border)}
.stars{display:inline-flex;gap:1px;font-size:10px}
.stars .sf{color:var(--star)}.stars .se{color:#e5e5ea}
.glass-card .gc-links{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.glass-card .gc-links .gl{font-size:9px;padding:1px 7px;border-radius:20px;font-weight:500}
.glass-card .gc-links .gl-link{background:var(--accent-soft);color:var(--accent)}
.glass-card .gc-links .gl-ref{background:#f0f0ff;color:var(--navy)}

/* ── Grid Layout ── */
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:4px}

/* ── Timeline ── */
.tl{position:relative;padding-left:28px;margin-top:4px}
.tl::before{content:'';position:absolute;left:10px;top:6px;bottom:6px;width:1.5px;background:var(--border);border-radius:1px}
.tl-item{position:relative;margin-bottom:10px}
.tl-item::before{content:'';position:absolute;left:-22px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 3px var(--accent-glass)}
.tl-item .tl-date{font-size:10px;color:var(--text-tertiary);margin-bottom:3px;font-weight:500;letter-spacing:.2px}
.tl-item .glass-card{margin-left:0}

/* ── Subject Card ── */
.sub-card{background:linear-gradient(135deg,var(--surface-glass),rgba(255,255,255,.95));-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:var(--radius-lg);border:1px solid var(--border-glass);box-shadow:var(--shadow-sm);padding:18px 20px;cursor:pointer;transition:all .3s var(--transition);margin-bottom:10px;display:flex;gap:14px;align-items:flex-start}
.sub-card:hover{box-shadow:var(--shadow-md);border-color:var(--border);transform:translateY(-2px)}
.sub-card .sub-icon{font-size:24px;flex-shrink:0;margin-top:1px}
.sub-card .sub-title{font-size:15px;font-weight:600;margin-bottom:3px}
.sub-card .sub-desc{font-size:12px;color:var(--text-secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub-card .sub-stats{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.sub-card .sub-stats span{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--accent-soft);color:var(--accent)}

/* ── Skill Card ── */
.sk-card{background:var(--surface-glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:var(--radius-md);border:1px solid var(--border-glass);box-shadow:var(--shadow-sm);padding:14px 16px;cursor:pointer;transition:all .3s var(--transition);margin-bottom:6px}
.sk-card:hover{box-shadow:var(--shadow-md);border-color:var(--border);transform:translateY(-2px)}
.sk-card .sk-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sk-card .sk-name{font-size:13px;font-weight:600}
.sk-card .sk-level{font-size:9.5px;padding:2px 10px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.sk-card .sk-bar{height:4px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:6px}
.sk-card .sk-bar .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),#5ac8fa);transition:width .6s var(--transition)}
.sk-card .sk-meta{display:flex;gap:10px;margin-top:4px;font-size:10px;color:var(--text-secondary)}
.sk-card .sk-tags{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.sk-card .sk-tags span{font-size:9px;padding:1px 7px;border-radius:4px;background:var(--border);color:var(--text-tertiary)}

/* ── Section Title ── */
.sec-title{font-size:11px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;padding-left:2px;letter-spacing:.3px;text-transform:uppercase}

/* ── Empty State ── */
.es{text-align:center;padding:48px 16px;color:var(--text-secondary)}
.es .ei{font-size:28px;margin-bottom:6px;opacity:.5}
.es p{font-size:12px}

/* ── FAB ── */
.fab{position:fixed;bottom:24px;right:24px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(0,113,227,.35);z-index:100;display:flex;align-items:center;justify-content:center;transition:all .2s var(--transition)}
.fab:hover{transform:scale(1.06);box-shadow:0 6px 24px rgba(0,113,227,.45)}
.fab2{position:fixed;bottom:24px;right:76px;height:36px;border-radius:18px;background:var(--surface-glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--text);border:1px solid var(--border);font-size:11px;cursor:pointer;box-shadow:var(--shadow-sm);z-index:99;display:flex;align-items:center;gap:4px;padding:0 14px;font-family:inherit;transition:all .2s var(--transition)}
.fab2:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}

/* ── Modal ── */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px)}
.mo.o{display:flex}
.mm{background:var(--surface-glass);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);border-radius:var(--radius-lg);width:100%;max-width:460px;max-height:85vh;overflow-y:auto;padding:22px 24px;box-shadow:var(--shadow-lg);border:1px solid var(--border-glass);animation:in .25s var(--transition)}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.mm h2{font-size:14px;font-weight:600;margin-bottom:2px}
.mm .ms{font-size:11px;color:var(--text-secondary);margin-bottom:14px}
.mm .cl{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-tertiary);padding:0;line-height:1;transition:color .2s}
.mm .cl:hover{color:var(--text)}
.f2{display:flex;gap:8px;margin-bottom:7px}
.f2 .fd{flex:1}
.f2 .fd label{font-size:10px;color:var(--text-secondary);margin-bottom:2px;font-weight:500;display:block;letter-spacing:.2px}
.f2 .fd input,.f2 .fd select,.f2 .fd textarea{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:rgba(255,255,255,.8);transition:all .2s var(--transition);color:var(--text)}
.f2 .fd input:focus,.f2 .fd select:focus,.f2 .fd textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-glass)}
.f2 .fd textarea{resize:vertical;min-height:32px}
.mm .sb2{width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:12.5px;font-family:inherit;cursor:pointer;font-weight:500;transition:opacity .2s,transform .15s;margin-top:6px}
.mm .sb2:hover{opacity:.92;transform:translateY(-.5px)}

@media(max-width:768px){
  .sb{width:52px}
  .sb-h{padding:16px 0 8px;text-align:center}
  .sb-h h1{font-size:0;justify-content:center}
  .sb-h h1 span{font-size:16px}
  .sb-n button{width:40px;margin:1px 4px;padding:7px 0;justify-content:center;font-size:0}
  .sb-n .sg{text-align:center;padding:10px 0 4px;font-size:9px}
  .sb-n button.active::before{display:none}
  .gr{grid-template-columns:1fr 1fr}
  .ct{padding:10px 12px 20px}
  .mn-h{padding:12px 14px 0}
  .f2{flex-direction:column;gap:0}
}
@media(max-width:480px){.gr{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="sb">
    <div class="sb-h"><h1><span>🧠</span>知识体系</h1></div>
    <div class="sb-n">
      <div class="sg">📔 日记</div>
      <button data-v="journal">📝 时间线</button>
      <button data-v="journal-week">📅 周记</button>
      <div class="sg">📥 输入</div>
      <button data-v="book">📚 书籍</button>
      <button data-v="movie">🎬 影视</button>
      <button data-v="article">📝 文章</button>
      <button data-v="podcast">🎙️ 播客</button>
      <div class="sg">🎯 技能</div>
      <button data-v="english">🇬🇧 英语</button>
      <button data-v="skill">🎨 技能</button>
      <div class="sg">📚 课题</div>
      <div id="subjectBtns"></div>
    </div>
  </div>
  <div class="mn">
    <div class="mn-h">
      <div class="vl" id="vl"><span class="c" id="cnt"></span></div>
      <div class="fr" id="fr"></div>
    </div>
    <div class="ct" id="content"></div>
  </div>
</div>
<button class="fab2" onclick="oM('subject')">📚 新课题</button>
<button class="fab" onclick="oM('manual')">＋</button>
<div class="mo" id="mo" onclick="cM(event)">
  <div class="mm" onclick="event.stopPropagation()">
    <button class="cl" onclick="cM()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// ═══ CONFIG ═══════════════════════════════════════════
const TYPES = {book:'📚',movie:'🎬',article:'📝',podcast:'🎙️',english:'🇬🇧',skill:'🎨',subject:'📚',review:'🔄',sop:'📋',idea:'💡',tool:'🔧'}
const LABELS = {book:'书籍',movie:'影视',article:'文章',podcast:'播客',english:'英语',skill:'技能',subject:'课题',review:'复盘',sop:'SOP',idea:'灵感',tool:'工具'}
const STATUS = {read:'已读',reading:'在读',want:'想读',done:'完成',watching:'在看',saved:'已存',listening:'在听',learning:'学习中',practicing:'练习中',mastered:'已掌握',todo:'待学',active:'启用',archived:'归档',ongoing:'进行中',paused:'暂停',using:'在用',tried:'试过'}
const SC = {read:'sd',reading:'si',want:'sw',done:'sd',watching:'si',saved:'sw',listening:'si',learning:'si',practicing:'sa',mastered:'sd',todo:'sw',active:'sa',archived:'sw',ongoing:'sa',paused:'sp',using:'sa',tried:'sw'}
const LVL = {beginner:'初级',intermediate:'中级',advanced:'高级',expert:'专家'}
const DEFAULTS = [
  {type:'journal',title:'开始搭建知识体系',date:'2026-07-25',body:'今天开始搭建个人知识体系，以日记·输入·技能·课题为支柱。',subjects:['知识体系构建']},
  {type:'journal',title:'读《文学地理学》笔记',date:'2026-07-23',body:'文学地理学涉及空间、地方与文学的关系，是跨学科研究的重要领域。',subjects:['文学地理学']},
  {type:'subject',title:'文学地理学',icon:'🌍',desc:'研究文学与地理空间关系的学科，关注文学中的地理意象、空间叙事、区域文学传统等。',date:'2026-07',tags:['文学','地理','空间']},
  {type:'subject',title:'鸟类知识体系',icon:'🐦',desc:'系统整理鸟类学知识，包括分类、生态、行为、观察记录等。',date:'2026-07',tags:['动物','生态','自然']},
  {type:'subject',title:'知识体系构建',icon:'🧠',desc:'个人知识管理方法论，研究如何有效构建第二大脑。',date:'2026-07',tags:['PKM','方法论']},
  {type:'book',title:'文学地理学',creator:'迈克·克朗',status:'reading',sub:'人文社科',date:'2026-07',tags:['文学','地理'],excerpt:'研究文学中的空间与地方。',region:'英国',subjects:['文学地理学']},
  {type:'book',title:'百年孤独',creator:'马尔克斯',status:'read',rating:5,sub:'文学小说',date:'2026-07',tags:['魔幻现实'],excerpt:'马孔多小镇的百年兴衰。',region:'拉美',subjects:['文学地理学']},
  {type:'book',title:'活着',creator:'余华',status:'read',rating:5,sub:'文学小说',date:'2025-12',tags:['中国文学'],excerpt:'人是为了活着本身而活着。',region:'中国'},
  {type:'movie',title:'霸王别姬',creator:'陈凯歌',status:'done',rating:5,sub:'剧情/历史',date:'2025-09',tags:['华语经典'],excerpt:'不疯魔不成活。',region:'中国',subjects:['文学地理学']},
  {type:'english',title:'Serendipity',creator:'词汇',status:'learning',level:'beginner',progress:30,sub:'词汇',date:'2026-07',tags:['词汇'],excerpt:'意外发现美好事物的能力。'},
  {type:'skill',title:'Live2D 建模',creator:'自学',status:'learning',level:'beginner',progress:25,sub:'数字绘画',date:'2026-07',tags:['Live2D','建模'],excerpt:'Live2D 角色建模与动画制作。'},
  {type:'skill',title:'UI/UX 设计',creator:'自学',status:'practicing',level:'intermediate',progress:55,sub:'设计',date:'2026-06',tags:['Figma','设计'],excerpt:'界面设计与用户研究。'},
  {type:'review',title:'7月第三周复盘',creator:'自己',status:'done',rating:4,sub:'weekly',date:'2026-07-21',tags:['复盘'],excerpt:'整体状态不错。',prompts:[{q:'成就？',a:'完成链接系统'},{q:'困难？',a:'会议太多'}],subjects:['知识体系构建']},
  {type:'sop',title:'周复盘流程',creator:'自我管理',status:'active',sub:'效率',date:'2026-07',tags:['复盘'],excerpt:'每周日的复盘标准流程。',steps:[{text:'回顾本周',done:false},{text:'检查进度',done:false},{text:'分析改进',done:false}],subjects:['知识体系构建']},
  {type:'tool',title:'Obsidian',creator:'Obsidian MD',status:'using',sub:'笔记',rating:5,date:'2025-06',tags:['PKM'],excerpt:'个人知识管理神器。',subjects:['知识体系构建']},
]
const DF = DEFAULTS.map(d=>d.title||d.body?.slice(0,20));const SK='kv3';let ITEMS=[],VIEW='journal',FIL='all'
function save(){const c=ITEMS.filter(i=>!DF.includes(i.title||i.body?.slice(0,20)));try{localStorage.setItem(SK,JSON.stringify(c))}catch(e){}}
function load(){ITEMS=JSON.parse(JSON.stringify(DEFAULTS));try{const s=localStorage.getItem(SK);if(s){let e=JSON.parse(s);if(Array.isArray(e))ITEMS.push(...e)}}catch(e){}save()}
function id(x){return ITEMS.indexOf(x)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sr(r){if(!r)return '';return Array.from({length:5},(_,i)=>`<span class="${i<r?'sf':'se'}">★</span>`).join('')}
function getSubjects(){return ITEMS.filter(i=>i.type==='subject')}
function statColor(s){return{read:'sd',reading:'si',want:'sw',done:'sd',watching:'si',saved:'sw',listening:'si',learning:'si',practicing:'sa',mastered:'sd',todo:'sw',active:'sa',archived:'sw',ongoing:'sa',paused:'sp',using:'sa',tried:'sw'}[s]||'sw'}

function render(){
  const ct=document.getElementById('content');const vl=document.getElementById('vl')
  // Deactivate all
  document.querySelectorAll('.sb-n button[data-v]').forEach(b=>b.classList.remove('active'))
  if(VIEW==='journal'){vl.innerHTML='📝 时间线 <span class="c" id="cnt"></span>';document.querySelector('button[data-v="journal"]')?.classList.add('active');renderJournal(ct)}
  else if(VIEW==='journal-week'){vl.innerHTML='📅 周记 <span class="c" id="cnt"></span>';document.querySelector('button[data-v="journal-week"]')?.classList.add('active');renderWeek(ct)}
  else if(VIEW==='skill'||VIEW==='english'){const lb={skill:'🎨 技能',english:'🇬🇧 英语'}[VIEW];vl.innerHTML=`${lb} <span class="c" id="cnt"></span>`;document.querySelector(`button[data-v="${VIEW}"]`)?.classList.add('active');renderSkills(ct,VIEW)}
  else if(VIEW.startsWith('sub:')){const sn=VIEW.slice(4);vl.innerHTML=`<span class="c" id="cnt"></span>`;renderSubject(ct,sn)}
  else if(TYPES[VIEW]){vl.innerHTML=`${TYPES[VIEW]} ${LABELS[VIEW]} <span class="c" id="cnt"></span>`;document.querySelector(`button[data-v="${VIEW}"]`)?.classList.add('active');renderItems(ct)}
  buildSubjectBtns()
}

function renderJournal(ct){
  const entries=ITEMS.filter(i=>i.type==='journal').sort((a,b)=>b.date.localeCompare(a.date))
  document.getElementById('cnt').textContent=entries.length
  if(!entries.length){ct.innerHTML=`<div class="es"><div class="ei">📝</div><p>暂无日记</p></div>`;return}
  ct.innerHTML=`<div class="tl">${entries.map(e=>`<div class="tl-item"><div class="tl-date">${e.date||''}</div><div class="glass-card" onclick="oD(${id(e)})"><h3>${esc(e.title||'')}</h3><div style="font-size:11.5px;color:var(--text-secondary);margin-top:2px">${esc(e.body||'')}</div>${e.subjects?.length?`<div class="gc-links">${e.subjects.map(s=>`<span class="gl gl-link">📚${esc(s)}</span>`).join('')}</div>`:''}</div></div>`).join('')}</div>`
}
function renderWeek(ct){
  const entries=ITEMS.filter(i=>i.type==='review'&&i.sub==='weekly').sort((a,b)=>b.date.localeCompare(a.date))
  document.getElementById('cnt').textContent=entries.length
  if(!entries.length){ct.innerHTML=`<div class="es"><div class="ei">📅</div><p>暂无周记</p></div>`;return}
  ct.innerHTML=`<div style="display:flex;flex-direction:column;gap:6px">${entries.map(e=>`<div class="glass-card" onclick="oD(${id(e)})"><div style="font-size:10px;color:var(--text-tertiary);margin-bottom:3px">${e.date||''}</div><h3>${esc(e.title||'')}</h3><div style="font-size:11.5px;color:var(--text-secondary);line-height:1.5">${esc(e.excerpt||'')}</div>${e.subjects?.length?`<div class="gc-links">${e.subjects.map(s=>`<span class="gl gl-link">📚${esc(s)}</span>`).join('')}</div>`:''}</div>`).join('')}</div>`
}
function renderSkills(ct,type){
  const list=ITEMS.filter(i=>i.type===type).sort((a,b)=>(b.progress||0)-(a.progress||0))
  document.getElementById('cnt').textContent=list.length
  if(!list.length){ct.innerHTML=`<div class="es"><div class="ei">🎯</div><p>暂无${type==='english'?'英语':'技能'}条目</p></div>`;return}
  ct.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px">${list.map(item=>{
    const pct=Math.min(item.progress||0,100)
    return `<div class="sk-card" onclick="oD(${id(item)})"><div class="sk-hd"><span class="sk-name">${type==='english'?'🇬🇧':'🎨'} ${esc(item.title)}</span><span class="sk-level">${LVL[item.level]||item.level||''}</span></div><div style="font-size:10px;color:var(--text-secondary);margin-bottom:2px">${esc(item.creator||'')} · ${esc(item.sub||'')}</div><div class="sk-bar"><div class="fill" style="width:${pct}%"></div></div><div class="sk-meta"><span>${pct}%</span><span>${STATUS[item.status]||item.status}</span></div>${item.tags?.length?`<div class="sk-tags">${item.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">${esc(item.excerpt||'')}</div></div>`
  }).join('')}</div>`
}
function renderSubject(ct,sn){
  const sub=ITEMS.find(i=>i.type==='subject'&&i.title===sn)
  const related=ITEMS.filter(i=>i.subjects?.includes(sn))
  document.getElementById('cnt').textContent=related.length
  let html=''
  if(sub)html+=`<div class="sub-card" onclick="oD(${id(sub)})"><div class="sub-icon">${sub.icon||'🌐'}</div><div class="sub-body"><div class="sub-title">${esc(sub.title)}</div><div class="sub-desc">${esc(sub.desc||'')}</div><div class="sub-stats">${sub.tags?.map(t=>`<span>#${esc(t)}</span>`).join('')||''}</div></div></div>`
  const groups={};related.forEach(i=>{const t=i.type;if(!groups[t])groups[t]=[];groups[t].push(i)})
  const order=['book','movie','article','podcast','english','skill','review','sop','idea','tool','journal']
  if(!related.length){html+=`<div class="es"><div class="ei">📭</div><p>暂无关联内容</p></div>`;ct.innerHTML=html;return}
  order.filter(t=>groups[t]).forEach(t=>{
    html+=`<div style="margin-bottom:14px"><div class="sec-title">${TYPES[t]||''} ${LABELS[t]||t}</div><div class="gr">${groups[t].map(item=>{
      return `<div class="glass-card" onclick="oD(${id(item)})"><div class="gc-top"><span class="gc-badge">${TYPES[item.type]||''} ${LABELS[item.type]||''}</span><span class="gc-status ${statColor(item.status)}">${STATUS[item.status]||item.status}</span></div><h3>${esc(item.title||'')}</h3><div class="gc-meta">${esc(item.creator||'')}${item.date?` · ${item.date}`:''}</div><div class="gc-excerpt">${esc(item.excerpt||'')}</div></div>`
    }).join('')}</div></div>`
  })
  ct.innerHTML=html
}
function renderItems(ct){
  let list=ITEMS.filter(i=>i.type===VIEW).sort((a,b)=>(b.date||'').localeCompare(a.date||''))
  if(FIL!=='all'){list=list.filter(i=>i.status===FIL||i.sub===FIL||(i.tags&&i.tags.includes(FIL)))}
  document.getElementById('cnt').textContent=list.length
  if(!list.length){ct.innerHTML=`<div class="es"><div class="ei">📭</div><p>暂无内容</p></div>`;buildFilter(list);return}
  ct.innerHTML=`<div class="gr">${list.map(item=>{
    const sl=item.subjects?.filter(s=>s).length||0
    return `<div class="glass-card" onclick="oD(${id(item)})"><div class="gc-top"><span class="gc-badge">${TYPES[item.type]||''} ${LABELS[item.type]||''}</span><span class="gc-status ${statColor(item.status)}">${STATUS[item.status]||item.status}</span></div><h3>${esc(item.title||'')}</h3><div class="gc-meta">${esc(item.creator||'')}${item.date?` · ${item.date}`:''}</div><div class="gc-meta">${esc(item.sub||'')}${item.rating?` · <span class="stars">${sr(item.rating)}</span>`:''}</div><div class="gc-excerpt">${esc(item.excerpt||'')}</div>${item.subjects?.length?`<div class="gc-links">${item.subjects.map(s=>`<span class="gl gl-link">📚${esc(s)}</span>`).join('')}</div>`:''}</div>`
  }).join('')}</div>`
  buildFilter(list)
}
function buildFilter(list){const f=document.getElementById('fr');f.innerHTML='<button class="active" data-v="all">全部</button>';const all=[...new Set([...list.map(i=>i.status),...list.map(i=>i.sub).filter(Boolean)])].slice(0,15);all.forEach(v=>{f.innerHTML+=`<button data-v="${v}">${STATUS[v]||v}</button>`});f.querySelectorAll('button').forEach(b=>{b.onclick=()=>{f.querySelectorAll('button').forEach(bb=>bb.classList.remove('active'));b.classList.add('active');FIL=b.dataset.v;render()}})}
function buildSubjectBtns(){const c=document.getElementById('subjectBtns');const subs=getSubjects();if(!subs.length){c.innerHTML='';return}c.innerHTML=subs.map(s=>`<button data-v="sub:${esc(s.title)}"><span class="si">${s.icon||'📚'}</span>${esc(s.title)}</button>`).join('');c.querySelectorAll('button').forEach(b=>{b.onclick=()=>{FIL='all';VIEW=b.dataset.v;render()}})}
document.querySelectorAll('.sb-n button[data-v]').forEach(b=>{b.onclick=()=>{FIL='all';VIEW=b.dataset.v;render()}})
function oD(i){localStorage.setItem('k_idx',JSON.stringify(i));localStorage.setItem('k_data',JSON.stringify(ITEMS));window.location.href='detail.html'}
function oM(m){document.getElementById('mo').classList.add('o');document.body.style.overflow='hidden';if(m==='subject')showSubjectModal();else showManualModal()}
function cM(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('mo').classList.remove('o');document.body.style.overflow=''}
function showSubjectModal(){
  document.getElementById('modalBody').innerHTML=`<h2>📚 新建课题</h2><p class="ms">创建一个新的知识研究领域</p><div class="f2"><div class="fd"><label>课题名称</label><input id="sT" placeholder="例：文学地理学"></div></div><div class="f2"><div class="fd"><label>图标</label><select id="sI"><option value="🌐">🌐 地球</option><option value="🐦">🐦 鸟类</option><option value="🧠">🧠 大脑</option><option value="📚">📚 书籍</option><option value="🎨">🎨 艺术</option><option value="🔬">🔬 科学</option><option value="🌿">🌿 自然</option><option value="🎵">🎵 音乐</option><option value="🏛️">🏛️ 历史</option></select></div></div><div class="f2"><div class="fd"><label>描述</label><textarea id="sD" rows="3" placeholder="这个课题研究什么？"></textarea></div></div><div class="f2"><div class="fd"><label>标签</label><input id="sTg" placeholder="逗号分隔"></div></div><button class="sb2" onclick="confirmSubject()">✅ 创建课题</button>`
}
function confirmSubject(){
  const title=document.getElementById('sT').value.trim();if(!title)return
  ITEMS.push({type:'subject',title,icon:document.getElementById('sI').value,desc:document.getElementById('sD').value.trim(),tags:document.getElementById('sTg').value.split(/[,，、]/).map(t=>t.trim()).filter(Boolean),date:new Date().toISOString().slice(0,10)});save();cM();buildSubjectBtns();VIEW=`sub:${title}`;FIL='all';render()
}
function showManualModal(){
  const subs=getSubjects()
  document.getElementById('modalBody').innerHTML=`<h2>➕ 添加</h2><p class="ms">记录你的所思所学</p><div class="f2"><div class="fd"><label>类型</label><select id="mType" onchange="buildMForm()"><option value="journal">📝 日记</option><option value="book">📚 书籍</option><option value="movie">🎬 影视</option><option value="article">📝 文章</option><option value="podcast">🎙️ 播客</option><option value="english">🇬🇧 英语</option><option value="skill">🎨 技能</option><option value="review">🔄 复盘</option><option value="sop">📋 SOP</option><option value="idea">💡 灵感</option><option value="tool">🔧 工具</option></select></div></div><div id="mForm"></div><button class="sb2" onclick="confirmManual()">✅ 添加</button>`
  buildMForm()
}
function buildMForm(){
  const type=document.getElementById('mType').value;const subs=getSubjects()
  const so=subs.length?`<div class="f2"><div class="fd"><label>关联课题</label><select id="mSubj"><option value="">不关联</option>${subs.map(s=>`<option value="${esc(s.title)}">${s.icon||'📚'} ${esc(s.title)}</option>`).join('')}</select></div></div>`:''
  if(type==='journal'){document.getElementById('mForm').innerHTML=`<div class="f2"><div class="fd"><label>标题</label><input id="mT"></div></div><div class="f2"><div class="fd"><label>内容</label><textarea id="mBody" rows="4"></textarea></div></div>${so}`;return}
  if(type==='skill'||type==='english'){
    const lv=[['beginner','初级'],['intermediate','中级'],['advanced','高级'],['expert','专家']];const ss={skill:[['learning','学习中'],['practicing','练习中'],['mastered','已掌握'],['paused','暂停']],english:[['learning','学习中'],['reading','在读'],['mastered','已掌握']]}[type]||[['learning','学习中']]
    document.getElementById('mForm').innerHTML=`<div class="f2"><div class="fd"><label>名称</label><input id="mT"></div><div class="fd"><label>来源</label><input id="mC"></div></div><div class="f2"><div class="fd"><label>等级</label><select id="mLV">${lv.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div><div class="fd"><label>状态</label><select id="mS">${ss.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div></div><div class="f2"><div class="fd"><label>分类</label><input id="mSub"></div><div class="fd"><label>${type==='skill'?'进度':'音标'}</label><input id="mEx"></div></div><div class="f2"><div class="fd"><label>进度</label><input type="range" min="0" max="100" value="50" oninput="document.getElementById('pv').textContent=this.value+'%'" style="flex:3"><span id="pv" style="font-size:11px;color:var(--text-secondary);min-width:36px">50%</span></div></div><div class="f2"><div class="fd"><label>标签</label><input id="mTg" placeholder="逗号分隔"></div></div><div class="f2"><div class="fd"><label>简介</label><textarea id="mEx" rows="2"></textarea></div></div>${so}`
    return
  }
  const el={book:'页数',movie:'年份',article:'来源',podcast:'平台',review:'周期',sop:'步骤',idea:'场景',tool:'平台'}[type]||'备注'
  document.getElementById('mForm').innerHTML=`<div class="f2"><div class="fd"><label>标题</label><input id="mT"></div><div class="fd"><label>作者</label><input id="mC"></div></div><div class="f2"><div class="fd"><label>状态</label><select id="mS">${({book:[['read','已读'],['reading','在读'],['want','想读']],movie:[['done','已看'],['watching','在看'],['want','想看']],article:[['read','已读'],['saved','待读']],podcast:[['done','已听'],['listening','在听'],['saved','待听']],review:[['done','完成'],['draft','草稿']],sop:[['active','启用'],['archived','归档']],idea:[['active','活跃'],['archived','归档']],tool:[['using','在用'],['tried','试过'],['want','想试']]}[type]||[['done','完成'],['todo','待做']]).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div><div class="fd"><label>评分</label><select id="mR"><option value="0">无</option>${[5,4,3,2,1].map(i=>`<option value="${i}">⭐${i}</option>`).join('')}</select></div></div><div class="f2"><div class="fd"><label>分类</label><input id="mSub"></div><div class="fd"><label>${el}</label><input id="mEx"></div></div><div class="f2"><div class="fd"><label>知识域</label><input id="mDm"></div><div class="fd"><label>地区</label><input id="mRg"></div></div><div class="f2"><div class="fd"><label>标签</label><input id="mTg"></div></div>${so}<div class="f2"><div class="fd"><label>简介</label><textarea id="mExcerpt" rows="2"></textarea></div></div>`
}
function confirmManual(){
  const type=document.getElementById('mType').value;const subj=document.getElementById('mSubj')?.value||'';const subjects=subj?[subj]:[]
  let item
  if(type==='journal'){item={type,title:document.getElementById('mT').value.trim()||'无标题',body:document.getElementById('mBody').value.trim()||'',date:new Date().toISOString().slice(0,10),subjects}}
  else if(type==='skill'||type==='english'){const pct=parseInt(document.querySelector('#mForm input[type=range]')?.value)||0
    item={type,title:document.getElementById('mT').value.trim(),creator:document.getElementById('mC')?.value.trim()||'',status:document.getElementById('mS')?.value||'learning',level:document.getElementById('mLV')?.value||'beginner',progress:pct,sub:document.getElementById('mSub')?.value.trim()||'',extra:document.getElementById('mEx')?.value.trim()||'',tags:document.getElementById('mTg')?.value.split(/[,，、]/).map(t=>t.trim()).filter(Boolean)||[],excerpt:document.getElementById('mExcerpt')?.value.trim()||'',date:new Date().toISOString().slice(0,10),subjects}}
  else{item={type,title:document.getElementById('mT').value.trim(),creator:document.getElementById('mC')?.value.trim()||'',status:document.getElementById('mS')?.value||'read',rating:parseInt(document.getElementById('mR')?.value)||0,sub:document.getElementById('mSub')?.value.trim()||'',extra:document.getElementById('mEx')?.value.trim()||'',tags:document.getElementById('mTg')?.value.split(/[,，、]/).map(t=>t.trim()).filter(Boolean)||[],domain:document.getElementById('mDm')?.value.split(/[,，、]/).map(t=>t.trim()).filter(Boolean)||[],region:document.getElementById('mRg')?.value.trim()||'通用',subjects,excerpt:document.getElementById('mExcerpt')?.value.trim()||'',date:new Date().toISOString().slice(0,10)}}
  if(!item.title&&type!=='journal')return;ITEMS.push(item);save();cM();VIEW=subj?`sub:${subj}`:type;FIL='all';render()
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.getElementById('mo');if(o.classList.contains('o'))cM()}})
load();render()
</script>
</body>
</html>
