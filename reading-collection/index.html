<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究工作室</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#F0ECE4;--surface:#F8F5EE;--ink:#1C1A16;--ink-mid:#4A443C;--ink-dim:#8C857A;--accent:#C43929;--rule:#D8D2C8;--rule-thin:#E8E4DC;--font-serif:Georgia,'Times New Roman',serif;--font-sans:'Inter',-apple-system,sans-serif;--font-headline:Georgia,'Times New Roman',serif;--reading:680px}
html{height:100%}
body{font-family:var(--font-serif);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.65;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:var(--rule);border-radius:0}
.app{display:flex;flex-direction:column;height:100vh}
.nav{display:flex;align-items:center;padding:0 40px;height:44px;border-bottom:2px solid var(--ink);background:var(--surface);flex-shrink:0;gap:0;position:relative;z-index:10}
.nav-logo{font-family:var(--font-headline);font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.3px;margin-right:20px;cursor:default;text-transform:uppercase}
.nav a{display:inline-flex;align-items:center;gap:4px;padding:0 12px;height:44px;text-decoration:none;color:var(--ink-mid);font-size:11px;font-weight:400;cursor:pointer;transition:color .15s;font-family:var(--font-sans);border:none;background:transparent;letter-spacing:.5px;text-transform:uppercase;position:relative}
.nav a:hover{color:var(--ink)}.nav a.active{color:var(--ink);font-weight:600}
.nav a.active::after{content:'';position:absolute;bottom:-2px;left:12px;right:12px;height:2px;background:var(--accent)}
.nav .spacer{flex:1}
.nav .action-btn{display:inline-flex;align-items:center;gap:4px;padding:0 10px;height:28px;background:transparent;color:var(--ink-dim);font-size:10px;font-family:var(--font-sans);cursor:pointer;letter-spacing:.5px;transition:color .15s;text-transform:uppercase;border:none}
.nav .action-btn:hover{color:var(--ink)}
.volume-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 40px;background:var(--surface);border-bottom:1px solid var(--rule);flex-shrink:0;font-family:var(--font-sans);font-size:8px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase}
.main{flex:1;overflow-y:auto;padding:0}.main::-webkit-scrollbar{width:2px}.main::-webkit-scrollbar-thumb{background:var(--rule);border-radius:0}
.reading{max-width:var(--reading);margin:0 auto;padding:48px 24px 80px}.reading-wide{max-width:840px;margin:0 auto;padding:48px 24px 80px}
.ed-h1{font-family:var(--font-headline);font-size:36px;font-weight:700;line-height:1.05;letter-spacing:-.8px;margin-bottom:6px;color:var(--ink)}
.ed-h2{font-family:var(--font-headline);font-size:22px;font-weight:700;line-height:1.2;margin-bottom:4px;margin-top:28px;color:var(--ink);letter-spacing:-.2px}
.ed-h3{font-family:var(--font-headline);font-size:16px;font-weight:700;line-height:1.3;margin-bottom:2px;margin-top:18px;color:var(--ink)}
.ed-body{font-size:15px;line-height:1.8;color:var(--ink-mid)}.ed-body p{margin-bottom:10px}
.ed-label{font-family:var(--font-sans);font-size:8px;color:var(--ink-dim);letter-spacing:1.5px;text-transform:uppercase;font-weight:500;margin-bottom:3px}
.ed-section-num{font-family:var(--font-sans);font-size:8px;color:var(--accent);letter-spacing:2.5px;font-weight:600;margin-bottom:2px;text-transform:uppercase}
.ed-caption{font-family:var(--font-serif);font-size:11px;color:var(--ink-dim);font-style:italic}
.ed-blockquote{border-left:2px solid var(--accent);padding:4px 16px;margin:10px 0;font-style:italic;color:var(--ink-mid);font-size:14px;line-height:1.6}
.ed-rule{border:none;border-top:2px solid var(--ink);margin:24px 0}
.ed-rule-thin{border:none;border-top:1px solid var(--rule);margin:16px 0}
.ed-rule-dotted{border:none;border-top:1px dotted var(--rule-thin);margin:12px 0}
.page-h{padding-bottom:12px;margin-bottom:20px;border-bottom:2px solid var(--ink);display:flex;align-items:flex-end;justify-content:space-between}
.page-h .left{flex:1}.page-h .count{font-family:var(--font-sans);font-size:9px;color:var(--ink-dim);letter-spacing:.5px}
.home-section{margin-bottom:20px;border-bottom:1px dotted var(--rule-thin);padding-bottom:12px}
.home-section .hs-title{font-family:var(--font-sans);font-size:8px;color:var(--ink-dim);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.home-section .hs-title::after{content:'';flex:1;height:1px;background:var(--rule-thin)}
.home-entry{display:block;padding:5px 0;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;font-size:14px;color:var(--ink-mid);border-bottom:1px dotted var(--rule-thin);transition:color .15s}
.home-entry:last-child{border-bottom:none}.home-entry:hover{color:var(--accent)}
.home-entry .he-date{font-family:var(--font-sans);font-size:8px;color:var(--ink-dim);margin-top:.5px;letter-spacing:.5px}
.tl{max-width:var(--reading);margin:0 auto;padding:32px 24px 60px}
.tl-entry{border-bottom:1px solid var(--rule-thin);padding:16px 0;cursor:pointer;transition:border-color .15s}
.tl-entry:first-child{padding-top:0}.tl-entry:hover{border-bottom-color:var(--accent)}
.tl-entry .tl-date{font-family:var(--font-sans);font-size:8px;color:var(--ink-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.tl-entry .tl-title{font-family:var(--font-headline);font-size:18px;font-weight:700;margin-bottom:2px;line-height:1.2;color:var(--ink)}
.tl-entry .tl-body{font-size:13.5px;color:var(--ink-mid);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-entry .tl-links{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tl-entry .tl-links span{font-size:10px;color:var(--accent);cursor:pointer;font-family:var(--font-sans);letter-spacing:.3px}
.tl-entry .tl-links span:hover{text-decoration:underline}
.reading-list{max-width:var(--reading);margin:0 auto;padding:32px 24px 60px}
.rl-item{display:block;padding:10px 0;border-bottom:1px dotted var(--rule-thin);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.rl-item:hover .rl-title{color:var(--accent)}
.rl-item .rl-type{font-family:var(--font-sans);font-size:7px;color:var(--ink-dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:1px}
.rl-item .rl-title{font-family:var(--font-headline);font-size:17px;font-weight:700;margin-bottom:1px;color:var(--ink);transition:color .15s}
.rl-item .rl-meta{font-family:var(--font-serif);font-size:11px;color:var(--ink-dim);font-style:italic}
.stars{display:inline-flex;gap:1px;font-size:10px;color:var(--ink-dim)}.stars .f{color:var(--ink)}.stars .e{color:var(--rule)}
.project-list{max-width:var(--reading);margin:0 auto;padding:32px 24px 60px}
.pl-item{display:block;padding:10px 0;border-bottom:1px dotted var(--rule-thin);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.pl-item:hover .pl-title{color:var(--accent)}
.pl-item .pl-title{font-family:var(--font-headline);font-size:17px;font-weight:700;margin-bottom:1px;color:var(--ink);transition:color .15s}
.pl-item .pl-desc{font-size:12px;color:var(--ink-dim);line-height:1.5;font-style:italic}
.concept-list{max-width:var(--reading);margin:0 auto;padding:32px 24px 60px}
.cl-item{display:block;padding:8px 0;border-bottom:1px dotted var(--rule-thin);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.cl-item:hover .cl-title{color:var(--accent)}
.cl-item .cl-title{font-family:var(--font-headline);font-size:20px;font-weight:700;margin-bottom:1px;color:var(--ink);transition:color .15s}
.cl-item .cl-def{font-size:13px;color:var(--ink-dim);line-height:1.5;font-style:italic}
.detail-page{max-width:var(--reading);margin:0 auto;padding:36px 24px 60px}
.detail-page .dp-back{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-sans);font-size:9px;color:var(--ink-dim);cursor:pointer;margin-bottom:20px;border:none;background:transparent;padding:0;letter-spacing:.5px;text-transform:uppercase;transition:color .15s}
.detail-page .dp-back:hover{color:var(--ink)}.detail-page .dp-h{margin-bottom:16px}
.detail-page .dp-meta{font-family:var(--font-sans);font-size:9px;color:var(--ink-dim);letter-spacing:.5px;display:flex;gap:12px;text-transform:uppercase}
.pd-section{margin-bottom:24px}
.pd-section .pd-title{font-family:var(--font-headline);font-size:16px;font-weight:700;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--rule);color:var(--ink);display:flex;align-items:center;gap:6px}
.pd-section .pd-body{font-size:13.5px;color:var(--ink-mid);line-height:1.7}.pd-section .pd-body p{margin-bottom:6px}
.cd-grid{display:grid;grid-template-columns:1fr 200px;gap:36px;max-width:840px;margin:0 auto;padding:36px 24px 60px}
.cd-main{min-width:0}
.cd-side .cd-widget{margin-bottom:16px}
.cd-side .cd-widget .cdw-title{font-family:var(--font-sans);font-size:8px;color:var(--ink-dim);letter-spacing:1.5px;text-transform:uppercase;font-weight:500;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--rule-thin)}
.cd-side .cd-widget .cdw-item{display:block;padding:3px 0;font-size:13px;color:var(--ink-mid);cursor:pointer;transition:color .15s;border:none;background:none;font-family:inherit;text-align:left}
.cd-side .cd-widget .cdw-item:hover{color:var(--accent)}
.cd-side .cd-widget .cdw-item .cdw-sub{font-size:10px;color:var(--ink-dim);font-style:italic}
.p-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--rule)}
.p-tabs button{padding:5px 14px;border:none;background:transparent;cursor:pointer;font-family:var(--font-sans);font-size:10px;color:var(--ink-dim);border-bottom:1px solid transparent;transition:all .15s;margin-bottom:-1px;letter-spacing:.5px;text-transform:uppercase}
.p-tabs button:hover{color:var(--ink)}.p-tabs button.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tree{list-style:none;padding:0}.tree li{margin:1px 0}
.tree-node{display:flex;align-items:center;gap:4px;padding:3px 0;cursor:pointer;transition:color .15s;font-size:13px;color:var(--ink-mid);font-family:var(--font-serif)}
.tree-node:hover{color:var(--ink)}
.tree-node .toggle{width:10px;height:10px;display:flex;align-items:center;justify-content:center;font-size:5px;color:var(--ink-dim);cursor:pointer;transition:transform .15s;flex-shrink:0}
.tree-node .toggle.exp{transform:rotate(90deg)}.tree-node .tt{flex:1;font-size:13px}
.tree-children{padding-left:14px;display:none}.tree-children.open{display:block}
.graph-wrap{max-width:840px;margin:0 auto;padding:32px 24px 60px}
.graph-container{background:var(--surface);border:1px solid var(--rule);padding:20px;position:relative;min-height:340px}
.graph-container svg{width:100%;height:100%;min-height:340px}
.graph-info{position:absolute;right:16px;top:16px;width:200px;background:var(--surface);border:1px solid var(--rule);padding:10px 12px;display:none}
.graph-info.show{display:block}
.graph-info .gi-title{font-family:var(--font-headline);font-size:14px;font-weight:700;margin-bottom:1px;color:var(--ink)}
.graph-info .gi-type{font-family:var(--font-sans);font-size:8px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.graph-info .gi-body{font-size:11px;color:var(--ink-mid);line-height:1.5;margin-bottom:3px}
.graph-info .gi-links span{font-size:9px;color:var(--accent);cursor:pointer}
.graph-info .gi-links span:hover{text-decoration:underline}
.mo{display:none;position:fixed;inset:0;background:rgba(28,26,22,.15);z-index:200;align-items:center;justify-content:center;padding:16px}
.mo.show{display:flex}
.mm{background:var(--surface);border:1px solid var(--ink);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 24px;animation:mi .2s ease-out}
@keyframes mi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.mm h2{font-family:var(--font-headline);font-size:20px;font-weight:700;margin-bottom:2px;color:var(--ink)}
.mm .ms{font-family:var(--font-sans);font-size:10px;color:var(--ink-dim);margin-bottom:12px;letter-spacing:.3px}
.mm .cl{float:right;background:none;border:none;font-size:18px;cursor:pointer;color:var(--ink-dim);line-height:1;transition:color .15s}
.mm .cl:hover{color:var(--ink)}
.f2{display:flex;gap:6px;margin-bottom:6px}.f2 .fd{flex:1}
.f2 .fd label{font-family:var(--font-sans);font-size:8px;color:var(--ink-dim);margin-bottom:2px;display:block;letter-spacing:.5px;text-transform:uppercase}
.f2 .fd input,.f2 .fd select,.f2 .fd textarea{width:100%;padding:6px 10px;border:1px solid var(--rule);font-family:var(--font-serif);font-size:13px;background:var(--paper);color:var(--ink);transition:border-color .15s}
.f2 .fd input:focus,.f2 .fd select:focus,.f2 .fd textarea:focus{outline:none;border-color:var(--ink)}
.f2 .fd textarea{resize:vertical;min-height:30px}
.mm .sub{width:100%;padding:6px;background:none;color:var(--ink);border:1px solid var(--ink);font-family:var(--font-sans);font-size:10px;cursor:pointer;font-weight:500;margin-top:4px;letter-spacing:.5px;text-transform:uppercase;transition:all .15s}
.mm .sub:hover{background:var(--ink);color:var(--surface)}
.content-blocks{margin:8px 0}.block{margin:10px 0}
.block-text{font-size:14.5px;line-height:1.75;color:var(--ink-mid)}.block-text p{margin-bottom:6px}
.block-image{border:1px solid var(--rule);padding:4px;background:var(--surface)}
.block-image img{width:100%;height:auto;display:block}
.block-image .img-cap{font-size:10px;color:var(--ink-dim);font-style:italic;padding:4px 6px}
.block-image-grid,.block-image-grid-3{display:grid;gap:4px;margin:10px 0}
.block-image-grid{grid-template-columns:1fr 1fr}.block-image-grid-3{grid-template-columns:1fr 1fr 1fr}
.block-image-grid .grid-item,.block-image-grid-3 .grid-item{border:1px solid var(--rule);padding:4px;background:var(--surface)}
.block-image-grid .grid-item img,.block-image-grid-3 .grid-item img{width:100%;height:auto;display:block}
.block-video{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border:1px solid var(--rule);background:var(--surface)}
.block-video iframe,.block-video video{position:absolute;top:0;left:0;width:100%;height:100%}
.block-video .vid-cap{font-size:10px;color:var(--ink-dim);font-style:italic;padding:4px 6px;position:absolute;bottom:0;left:0;right:0;background:rgba(248,245,238,.9)}
.block-audio{border:1px solid var(--rule);padding:10px 14px;background:var(--surface);display:flex;align-items:center;gap:10px}
.block-audio .play-btn{width:30px;height:30px;border:1px solid var(--ink);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink);flex-shrink:0}
.block-audio .audio-meta{flex:1}
.block-audio .audio-meta .au-title{font-size:12px;color:var(--ink-mid)}
.block-audio .audio-meta .au-dur{font-size:10px;color:var(--ink-dim)}
.block-audio .audio-bar{width:60px;height:4px;background:var(--rule);margin-top:4px}
.block-audio .audio-bar .fill{height:100%;width:30%;background:var(--ink)}
.block-quote{border-left:2px solid var(--accent);padding:4px 16px;margin:10px 0;font-style:italic;color:var(--ink-mid);font-size:14px;line-height:1.6}
.block-quote .q-src{font-size:10px;color:var(--ink-dim);margin-top:2px;font-style:normal;font-family:var(--font-sans)}
.empty{text-align:center;padding:40px 16px;color:var(--ink-dim);font-family:var(--font-serif);font-style:italic;font-size:13px}
.welcome{font-family:var(--font-headline);font-size:34px;font-weight:700;letter-spacing:-.5px;margin-bottom:2px;line-height:1.1;color:var(--ink)}
.welcome-sub{font-family:var(--font-serif);font-size:14px;color:var(--ink-dim);font-style:italic;margin-bottom:4px}
.ai-tag{font-family:var(--font-sans);font-size:7px;color:var(--accent);letter-spacing:.5px;border:1px solid var(--accent);padding:1px 6px;display:inline-block;margin-right:4px;vertical-align:middle}
@media(max-width:680px){.nav{padding:0 12px;overflow-x:auto}.nav a{white-space:nowrap;padding:0 8px;font-size:10px}.nav-logo{font-size:12px;margin-right:10px}.volume-bar{padding:4px 12px}.reading,.reading-wide,.tl,.reading-list,.project-list,.concept-list,.detail-page{padding:24px 16px 48px}.cd-grid{grid-template-columns:1fr;gap:20px;padding:24px 16px 48px}.graph-wrap{padding:24px 16px 48px}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="nav-logo">研究工作室</div>
    <a class="active" data-p="home">首页</a>
    <a data-p="journal">日记</a>
    <a data-p="reading">阅读</a>
    <a data-p="project">课题</a>
    <a data-p="concept">概念</a>
    <a data-p="graph">图谱</a>
    <div class="spacer"></div>
    <button class="action-btn" onclick="showSearch()">搜索</button>
    <button class="action-btn" onclick="showImport()">导入</button>
    <button class="action-btn" onclick="showAdd()">＋ 新建</button>
  </nav>
  <div class="volume-bar"><span>VOL. I · NO. 7</span><span>JULY 2026</span><span>PERSONAL RESEARCH STUDIO</span></div>
  <div class="main" id="main"></div>
</div>
<div class="mo" id="searchModal" onclick="if(event.target===this)closeSearch()">
  <div class="mm" style="max-width:560px" onclick="event.stopPropagation()">
    <div class="f2"><div class="fd"><input id="searchInput" placeholder="Search…" style="font-size:14px;padding:10px 14px" autofocus oninput="doSearch()"></div></div>
    <div id="searchResults" style="max-height:400px;overflow-y:auto"></div>
  </div>
</div>
<div class="mo" id="importModal" onclick="if(event.target===this)closeImport()">
  <div class="mm" onclick="event.stopPropagation()">
    <button class="cl" onclick="closeImport()">✕</button>
    <h2>导入链接</h2>
    <p class="ms">粘贴链接，AI 自动分析标题、类型、标签并建议关联</p>
    <div class="f2"><div class="fd"><input id="importUrl" placeholder="https://…"></div></div>
    <button class="sub" onclick="doImport()">分析</button>
    <div id="importResult" style="margin-top:8px;display:none"></div>
  </div>
</div>
<div class="mo" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="mm" onclick="event.stopPropagation()">
    <button class="cl" onclick="closeAdd()">✕</button>
    <h2>新建</h2>
    <p class="ms">选择类型开始记录</p>
    <div class="f2"><div class="fd"><label>类型</label><select id="aType" onchange="buildAddForm()"><option value="journal">日记</option><option value="reading">阅读</option><option value="project">课题</option><option value="concept">概念</option><option value="skill">技能</option></select></div></div>
    <div id="addForm"></div>
    <button class="sub" onclick="confirmAdd()">创建</button>
  </div>
</div>
<script>
const DATA={
  journal:[{id:'j1',title:'开始搭建研究工作室',date:'2026-07-25',blocks:[{t:'text',c:'今天开始构建个人研究工作室。'},{t:'quote',c:'知识不是累积的，而是连接的。',meta:{source:'Manifesto'}}],tags:['研究','知识管理'],rels:{projects:['p1'],concepts:['c3']}},
    {id:'j2',title:'文化地理学笔记',date:'2026-07-22',blocks:[{t:'text',c:'空间与地方的区分是基础性的。空间是抽象的；地方是被经验、被赋予意义的。'},{t:'quote',c:'地方通过人的体验被不断创造和重塑。',meta:{source:'Mike Crang'}}],tags:['地理','文化'],rels:{projects:['p1'],reading:['r1'],concepts:['c1','c2']}},
    {id:'j3',title:'中山公园观鸟',date:'2026-07-20',blocks:[{t:'text',c:'观察到一只大斑啄木鸟和一群银喉长尾山雀。'}],tags:['观鸟'],rels:{projects:['p2'],concepts:['c4']}}],

function getBlocks(j){if(j.blocks&&j.blocks.length)return j.blocks;if(j.body)return[{t:'text',c:j.body}];return[]}
function renderBlocks(blocks){if(!blocks||!blocks.length)return''
  let single='',i=0,result=''
  for(const b of blocks){
    if(b.t==='text')single+=`<div class="block block-text"><p>${esc(b.c||'')}</p></div>`
    else if(b.t==='quote')single+=`<div class="block block-quote">${esc(b.c||'')}${b.meta?.source?`<div class="q-src">— ${esc(b.meta.source)}</div>`:''}</div>`
    else if(b.t==='video')single+=`<div class="block block-video"><div style="padding:40px;text-align:center;color:var(--ink-dim);font-size:12px">[video]</div>${b.meta?.caption?`<div class="vid-cap">${esc(b.meta.caption)}</div>`:''}</div>`
    else if(b.t==='audio')single+=`<div class="block block-audio"><div class="play-btn">▶</div><div class="audio-meta"><div class="au-title">${esc(b.meta?.title||'Audio')}</div><div class="au-dur">${esc(b.meta?.duration||'')}</div><div class="audio-bar"><div class="fill"></div></div></div></div>`
  }
  while(i<blocks.length){
    const imgs=[]
    while(i<blocks.length&&blocks[i].t==='image'&&imgs.length<3){imgs.push(blocks[i]);i++}
    if(imgs.length===2)result+=`<div class="block-image-grid">${imgs.map(x=>`<div class="grid-item"><div style="height:120px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:10px">[image]</div></div>`).join('')}</div>`
    else if(imgs.length===3)result+=`<div class="block-image-grid-3">${imgs.map(x=>`<div class="grid-item"><div style="height:100px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:10px">[image]</div></div>`).join('')}</div>`
    else if(imgs.length===1)result+=`<div class="block block-image"><div style="height:180px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:12px">[image]</div></div>`
    else{i++;result+=single;single=''}
  }
  return result+single
}

function closeSearch(){document.getElementById('searchModal').classList.remove('show');document.body.style.overflow=''}
function doSearch(){const q=document.getElementById('searchInput').value.toLowerCase().trim();const res=document.getElementById('searchResults');if(!q){res.innerHTML='<div style="padding:12px 0;font-size:12px;color:var(--ink-dim)">输入关键词搜索…</div>';return}let r=[];Object.entries(DATA).forEach(([t,items])=>{items.forEach(item=>{if((item.title||'').toLowerCase().includes(q)||(item.notes||'').toLowerCase().includes(q)||(item.definition||'').toLowerCase().includes(q)||(item.tags||[]).join(' ').includes(q))r.push({type:t,id:item.id,title:item.title})})});r=r.slice(0,12);res.innerHTML=r.length?r.map(x=>{const nt={journal:'journal',reading:'reading',project:'project',concept:'concept'}[x.type]||'home';const act=nt==='project'?`navigateToProject('${x.id}')`:`openDetail('${nt}','${x.id}')`;return`<div style="padding:6px 0;border-bottom:1px dotted var(--rule-thin);cursor:pointer" onclick="closeSearch();${act}"><div style="font-size:13px;color:var(--ink-mid)">${esc(x.title)}</div><div style="font-size:8px;color:var(--ink-dim)">${x.type}</div></div>`}).join(''):'<div style="padding:12px 0;font-size:12px;color:var(--ink-dim)">无结果</div>'}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();showSearch()}if(e.key==='Escape'){['searchModal','importModal','addModal'].forEach(m=>{const el=document.getElementById(m);if(el&&el.classList.contains('show'))el.classList.remove('show')});document.body.style.overflow=''}})
// ═══ TASK 4: IMPORT ═══
function showImport(){document.getElementById('importModal').classList.add('show');document.body.style.overflow='hidden'}
function closeImport(){document.getElementById('importModal').classList.remove('show');document.body.style.overflow=''}
function doImport(){const url=document.getElementById('importUrl').value.trim();if(!url)return
  const ir=document.getElementById('importResult');ir.style.display='block'
  // Simulate AI analysis
  const title=url.includes('youtube')||url.includes('bilibili')?'Video Title (AI extracted)':url.includes('arxiv')?'Paper Title (AI extracted)':'Page Title (AI extracted)'
  const type=url.includes('youtube')||url.includes('bilibili')?'video':url.includes('arxiv')||url.includes('.pdf')?'paper':'website'
  const tags=['AI导入']
  if(url.includes('geograph')||url.includes('spatial'))tags.push('地理','空间')
  if(url.includes('bird')||url.includes('ornith'))tags.push('鸟类','生态')
  ir.innerHTML=`<div style="padding:12px;border:1px solid var(--rule);margin-top:8px">
    <div style="font-size:12px;font-weight:600;margin-bottom:2px">${esc(title)}</div>
    <div style="font-size:9px;color:var(--ink-dim);margin-bottom:4px">类型：${type} · 来源：${new URL(url).hostname}</div>
    <div style="font-size:10px;color:var(--ink-dim);margin-bottom:4px">摘要：AI 将从页面正文中提取摘要并识别关键实体。</div>
    <div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px">${tags.map(t=>`<span style="font-size:8px;padding:1px 6px;border:1px solid var(--rule);color:var(--ink-dim)">${t}</span>`).join('')}</div>
    <div style="display:flex;gap:4px;margin-top:6px">
      <span style="font-size:9px;color:var(--ink-dim)">建议关联：</span>
      ${DATA.project.slice(0,2).map(p=>`<span style="font-size:9px;color:var(--accent);cursor:pointer">${p.title}</span>`).join('')}
    </div>
    <div style="margin-top:8px;padding-top:6px;border-top:1px dotted var(--rule-thin);display:flex;gap:6px">
      <button class="dp-back" style="cursor:pointer;font-size:9px" onclick="closeImport();openDetail('reading','${DATA.reading[0].id}')">查看结果</button>
      <span style="font-size:8px;color:var(--ink-dim);font-style:italic">AI 分析结果可编辑后再入库</span>
    </div>
  </div>`
}
// ═══ ADD NEW ═══
function showAdd(){document.getElementById('addModal').classList.add('show');document.body.style.overflow='hidden';buildAddForm()}
function closeAdd(){document.getElementById('addModal').classList.remove('show');document.body.style.overflow=''}
function buildAddForm(){const tp=document.getElementById('aType').value
  if(tp==='journal'){document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>标题</label><input id="aT"></div></div><div class="f2"><div class="fd"><label>内容</label><textarea id="aB" rows="4"></textarea></div></div>`;return}
  if(tp==='reading'){document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>标题</label><input id="aT"></div><div class="fd"><label>类型</label><select id="aST"><option value="book">书籍</option><option value="movie">电影</option><option value="paper">论文</option><option value="website">网页</option></select></div></div><div class="f2"><div class="fd"><label>作者</label><input id="aC"></div><div class="fd"><label>标签</label><input id="aTg" placeholder="逗号分隔"></div></div>`;return}
  if(tp==='project'){document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>名称</label><input id="aT"></div></div><div class="f2"><div class="fd"><label>描述</label><textarea id="aD" rows="3"></textarea></div></div>`;return}
  if(tp==='concept'){document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>名称</label><input id="aT"></div></div><div class="f2"><div class="fd"><label>定义</label><textarea id="aD" rows="3"></textarea></div></div>`;return}
  if(tp==='skill'){document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>技能</label><input id="aT"></div><div class="fd"><label>等级</label><select id="aL"><option value="beginner">初级</option><option value="intermediate">中级</option><option value="advanced">高级</option></select></div></div>`}
}
function confirmAdd(){const tp=document.getElementById('aType').value;const t=document.getElementById('aT')?.value.trim();if(!t)return;const id=tp.charAt(0)+Date.now();let item={id,title:t,tags:[],createdAt:new Date().toISOString(),rels:{}}
  if(tp==='journal'){item.blocks=[{t:'text',c:document.getElementById('aB')?.value.trim()||''}];item.date=new Date().toISOString().slice(0,10)}
  else if(tp==='reading'){item.type=document.getElementById('aST')?.value||'book';item.creator=document.getElementById('aC')?.value.trim()||'';item.tags=document.getElementById('aTg')?.value.split(',').map(s=>s.trim()).filter(Boolean)||[];item.notes='';item.highlights=[]}
  else if(tp==='project'){item.icon='◇';item.desc=document.getElementById('aD')?.value.trim()||'';item.aiBackground='';item.tree=[];item.readings=[];item.concepts=[];item.journal=[]}
  else if(tp==='concept'){item.definition=document.getElementById('aD')?.value.trim()||'';item.background=''}
  else if(tp==='skill'){item.level=document.getElementById('aL')?.value||'beginner';item.progress=0;item.status='learning';item.practices=[]}
  if(!DATA[tp])DATA[tp]=[];DATA[tp].push(item);persist();closeAdd();render()
}
render()
</script>
</body>
</html>
