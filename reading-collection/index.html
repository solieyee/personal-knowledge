<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Research Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

/* ── Design Tokens ── */
:root {
  --bg: #F6F4EF;
  --surface: #FBFAF7;
  --border: #DDD6C8;
  --primary: #1E1E1E;
  --secondary: #78736A;
  --accent: #6B7F5B;
  --accent-light: #E8EDE4;
  --accent-dim: #D5DDCE;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --font-serif: 'Libre Baskerville', 'Cormorant Garamond', Georgia, serif;
  --font-sans: 'Inter', -apple-system, sans-serif;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--primary);font-size:14px;line-height:1.7;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-light);color:var(--primary)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline;color:var(--primary)}

/* ── Grid pattern overlay ── */
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:.15}
.app{position:relative;display:flex;flex-direction:column;height:100vh;z-index:1}

/* ── Icon SVG (Lucide-like) ── */
.icon{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--secondary)}
.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon-sm svg{width:14px;height:14px}
.icon-lg svg{width:20px;height:20px}

/* ── Nav ── */
.nav{display:flex;align-items:center;padding:0 32px;height:52px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;gap:2px;position:relative;z-index:10}
.nav-logo{font-family:var(--font-serif);font-size:15px;font-weight:700;color:var(--primary);letter-spacing:-.3px;margin-right:20px;display:flex;align-items:center;gap:8px;cursor:pointer;opacity:.8}
.nav-logo:hover{opacity:1}
.nav a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);text-decoration:none;color:var(--secondary);font-size:12px;font-weight:400;cursor:pointer;transition:all .12s;font-family:inherit;border:none;background:transparent;text-transform:lowercase;letter-spacing:.3px}
.nav a:hover{background:var(--bg);color:var(--primary)}.nav a.active{color:var(--primary);font-weight:500}
.nav .spacer{flex:1}
.nav .search-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--secondary);font-size:11px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .12s}
.nav .search-btn:hover{border-color:var(--accent);color:var(--primary)}.nav .search-btn:focus-within{border-color:var(--accent)}

/* ── Main ── */
.main{flex:1;overflow-y:auto;padding:32px 48px 60px;max-width:1100px;margin:0 auto;width:100%}
.main::-webkit-scrollbar{width:3px}.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(max-width:860px){.main{padding:20px 16px 60px}.nav{padding:0 12px;overflow-x:auto}.nav a{white-space:nowrap;padding:4px 8px;font-size:11px}.nav-logo{font-size:13px;margin-right:10px}}

/* ── Page Header ── */
.page-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.page-h h1{font-family:var(--font-serif);font-size:24px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
.page-h .sub{font-size:12px;color:var(--secondary);margin-top:2px;font-weight:400}
.page-h .count{font-size:11px;color:var(--secondary);border:1px solid var(--border);padding:2px 10px;border-radius:20px}

/* ── Cards (Archive Card style) ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;cursor:pointer;transition:all .2s;position:relative}
.card:hover{border-color:var(--accent);background:#FAF9F6}
.card:active{transform:scale(.995)}
.card .card-type{font-size:9px;color:var(--secondary);letter-spacing:.5px;text-transform:uppercase;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.card h3{font-family:var(--font-serif);font-size:15px;font-weight:600;margin-bottom:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:11px;color:var(--secondary);margin-bottom:3px}
.card .ex{font-size:13px;color:var(--secondary);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:300}
.card .tags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.card .tags span{font-size:9px;padding:1px 7px;border-radius:3px;background:var(--bg);color:var(--secondary);letter-spacing:.2px}
.stars{display:inline-flex;gap:1px;font-size:10px}.stars .f{color:#B8860B}.stars .e{color:#E0DDD5}

/* ── Grids ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid-full{grid-column:1/-1}

/* ── Home ── */
.home-section{margin-bottom:32px}
.home-section .hs-title{font-family:var(--font-serif);font-size:13px;font-weight:600;color:var(--secondary);margin-bottom:10px;letter-spacing:.3px;display:flex;align-items:center;gap:6px;text-transform:lowercase}
.home-section .hs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.welcome{font-family:var(--font-serif);font-size:26px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px}
.welcome-sub{font-size:13px;color:var(--secondary);margin-bottom:24px;font-weight:300}

/* ── Timeline (Journal) ── */
.tl{position:relative;padding-left:28px}
.tl::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:14px}
.tl-item::before{content:'';position:absolute;left:-22px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--accent);border:1.5px solid var(--surface)}
.tl-date{font-size:10px;color:var(--secondary);letter-spacing:.3px;margin-bottom:3px;text-transform:uppercase}
.tl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;cursor:pointer;transition:all .2s}
.tl-card:hover{border-color:var(--accent)}
.tl-card h3{font-family:var(--font-serif);font-size:15px;font-weight:600;margin-bottom:3px}
.tl-card .body{font-size:13px;color:var(--secondary);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:300}
.tl-card .links{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
.tl-card .links span{font-size:9px;padding:1px 7px;border-radius:3px;background:var(--accent-light);color:var(--accent);cursor:pointer;transition:all .1s}
.tl-card .links span:hover{background:var(--accent);color:#fff}

/* ── Concept Cards ── */
.concept-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;cursor:pointer;transition:all .2s;display:flex;gap:10px;align-items:flex-start}
.concept-card:hover{border-color:var(--accent);background:#FAF9F6}
.concept-card .ci{width:28px;height:28px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:var(--accent)}
.concept-card .cb{flex:1}
.concept-card .cb .cn{font-family:var(--font-serif);font-size:14px;font-weight:600;margin-bottom:1px}
.concept-card .cb .cd{font-size:11px;color:var(--secondary);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.concept-card .cb .cr{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.concept-card .cb .cr span{font-size:9px;padding:1px 6px;border-radius:3px;background:var(--bg);color:var(--secondary)}

/* ── Project Hero ── */
.p-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 32px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start}
.p-hero .pi{width:44px;height:44px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.p-hero .pt{font-family:var(--font-serif);font-size:22px;font-weight:700;margin-bottom:2px}
.p-hero .pd{font-size:12px;color:var(--secondary);line-height:1.6;max-width:600px}
.p-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border)}
.p-tabs button{padding:6px 16px;border:none;background:transparent;cursor:pointer;font-size:11px;font-family:inherit;color:var(--secondary);border-bottom:1px solid transparent;transition:all .12s;margin-bottom:-1px;letter-spacing:.3px;text-transform:lowercase}
.p-tabs button:hover{color:var(--primary)}.p-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}

/* ── Tree ── */
.tree{list-style:none}.tree li{margin:1px 0}
.tree-node{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:var(--radius-sm);cursor:pointer;transition:all .1s;font-size:12px;color:var(--secondary)}
.tree-node:hover{background:var(--bg);color:var(--primary)}
.tree-node .toggle{width:12px;height:12px;display:flex;align-items:center;justify-content:center;font-size:6px;color:var(--border);cursor:pointer;transition:transform .15s}
.tree-node .toggle.exp{transform:rotate(90deg)}
.tree-node .tt{flex:1}.tree-children{padding-left:18px;display:none}.tree-children.open{display:block}

/* ── Detail Page ── */
.detail-page{padding:0;max-width:700px}
.detail-page .dp-back{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--secondary);cursor:pointer;margin-bottom:16px;border:none;background:transparent;font-family:inherit;padding:2px 0;transition:all .1s}
.detail-page .dp-back:hover{color:var(--primary)}
.detail-page .dp-h{margin-bottom:20px}
.detail-page .dp-h h1{font-family:var(--font-serif);font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.2;margin-bottom:4px}
.detail-page .dp-h .dp-meta{font-size:11px;color:var(--secondary);display:flex;gap:12px;flex-wrap:wrap}
.detail-page .dp-section{margin-bottom:24px}
.detail-page .dp-section .sec-title{font-size:10px;font-weight:600;color:var(--secondary);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.detail-page .dp-section .sec-body{font-size:13px;color:var(--primary);line-height:1.8;font-weight:300}
.detail-page .dp-section .sec-body p{margin-bottom:8px}
.detail-page .dp-section .rel-items{display:flex;gap:4px;flex-wrap:wrap}
.detail-page .dp-section .rel-items span{padding:2px 10px;border-radius:12px;font-size:11px;background:var(--accent-light);color:var(--accent);cursor:pointer;transition:all .1s}
.detail-page .dp-section .rel-items span:hover{background:var(--accent);color:#fff}

/* ── Filter ── */
.fb{display:flex;gap:3px;margin-bottom:16px;flex-wrap:wrap}
.fb button{padding:3px 12px;border-radius:20px;border:1px solid transparent;background:transparent;color:var(--secondary);cursor:pointer;font-size:11px;font-family:inherit;transition:all .12s}
.fb button:hover{border-color:var(--border);color:var(--primary)}
.fb button.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── Graph ── */
.graph-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;position:relative;min-height:400px;overflow:hidden}
.graph-container svg{width:100%;height:100%;min-height:400px}
.graph-info{position:absolute;right:20px;top:20px;width:240px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.04);display:none}
.graph-info.show{display:block}
.graph-info .gi-title{font-family:var(--font-serif);font-size:15px;font-weight:600;margin-bottom:2px}
.graph-info .gi-type{font-size:9px;color:var(--secondary);letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.graph-info .gi-body{font-size:11px;color:var(--secondary);line-height:1.5;margin-bottom:4px}
.graph-info .gi-links{display:flex;gap:3px;flex-wrap:wrap}
.graph-info .gi-links span{padding:1px 7px;border-radius:3px;font-size:9px;background:var(--bg);color:var(--secondary);cursor:pointer}

/* ── Modal ── */
.mo{display:none;position:fixed;inset:0;background:rgba(30,30,30,.15);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.mo.show{display:flex}
.mm{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:24px 28px;box-shadow:0 16px 48px rgba(0,0,0,.06);animation:mi .2s}
@keyframes mi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mm h2{font-family:var(--font-serif);font-size:18px;font-weight:700;margin-bottom:2px}
.mm .ms{font-size:11px;color:var(--secondary);margin-bottom:14px}
.mm .cl{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--secondary);line-height:1}
.f2{display:flex;gap:8px;margin-bottom:7px}
.f2 .fd{flex:1}
.f2 .fd label{font-size:10px;color:var(--secondary);margin-bottom:2px;font-weight:500;display:block;letter-spacing:.3px;text-transform:uppercase}
.f2 .fd input,.f2 .fd select,.f2 .fd textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:var(--bg);transition:all .12s;color:var(--primary)}
.f2 .fd input:focus,.f2 .fd select:focus,.f2 .fd textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.f2 .fd textarea{resize:vertical;min-height:34px}
.mm .sub{width:100%;padding:7px;background:var(--primary);color:#fff;border:none;border-radius:var(--radius-sm);font-size:12px;font-family:inherit;cursor:pointer;font-weight:500;margin-top:4px;transition:all .12s}
.mm .sub:hover{opacity:.85}

/* ── Empty ── */
.empty{text-align:center;padding:48px 16px;color:var(--secondary)}.empty .ei{font-size:24px;margin-bottom:4px;opacity:.4;font-family:var(--font-serif)}

@media(max-width:640px){.grid-2{grid-template-columns:1fr}.home-section .hs-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="app">
  <nav class="nav">
    <div class="nav-logo">◈ Research Studio</div>
    <a class="active" data-p="home">Home</a>
    <a data-p="journal">Journal</a>
    <a data-p="reading">Reading</a>
    <a data-p="project">Projects</a>
    <a data-p="concept">Concepts</a>
    <a data-p="graph">Graph</a>
    <div class="spacer"></div>
    <button class="search-btn" onclick="showSearch()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>Search</button>
    <button class="search-btn" style="margin-left:4px" onclick="showImport()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Import</button>
    <button class="search-btn" style="margin-left:4px" onclick="showAdd()">＋ New</button>
  </nav>
  <div class="main" id="main"></div>
</div>

<!-- Search Modal -->
<div class="mo" id="searchModal" onclick="if(event.target===this)closeSearch()">
  <div class="mm" style="max-width:560px" onclick="event.stopPropagation()">
    <div class="f2"><div class="fd"><input id="searchInput" placeholder="Search research studio…" style="font-size:14px;padding:10px 14px" autofocus oninput="doSearch()"></div></div>
    <div id="searchResults" style="max-height:400px;overflow-y:auto"></div>
  </div>
</div>

<!-- Import Modal -->
<div class="mo" id="importModal" onclick="if(event.target===this)closeImport()">
  <div class="mm" onclick="event.stopPropagation()">
    <button class="cl" onclick="closeImport()">✕</button>
    <h2>Import</h2>
    <p class="ms">Paste a link to automatically analyse and index</p>
    <div class="f2"><div class="fd"><input id="importUrl" placeholder="https://…" style="font-size:13px"></div></div>
    <button class="sub" onclick="doImport()">Analyse</button>
    <div id="importResult" style="margin-top:8px;display:none"></div>
  </div>
</div>

<!-- Add Modal -->
<div class="mo" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="mm" onclick="event.stopPropagation()">
    <button class="cl" onclick="closeAdd()">✕</button>
    <h2>New</h2>
    <p class="ms">Choose type to begin</p>
    <div class="f2"><div class="fd"><label>Type</label><select id="aType" onchange="buildAddForm()"><option value="journal">Journal</option><option value="reading">Reading</option><option value="project">Project</option><option value="concept">Concept</option><option value="skill">Skill</option></select></div></div>
    <div id="addForm"></div>
    <button class="sub" onclick="confirmAdd()">Create</button>
  </div>
</div>

<script>
// ═══ ICONS ═══════════════════════════════════════
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><use href="#${name}"/></svg>`}

// ═══ DATA ═══════════════════════════════════════
const DATA={
  journal:[{id:'j1',title:'Beginning the Research Studio',date:'2026-07-25',body:'Today I began constructing the Personal Research Studio — a space for long-form reading, research, and writing. The structure rests on six pillars: Journal, Reading, Project, Concept, Skill, and Graph.',tags:['research','pkm'],rels:{projects:['p1'],concepts:['c3']}},
    {id:'j2',title:'Notes on Cultural Geography',date:'2026-07-22',body:'The distinction between space and place is foundational. Space is abstract, geometric; place is lived, meaningful. Every landscape carries traces of the cultures that shaped it.',tags:['geography','culture'],rels:{projects:['p1'],reading:['r1'],concepts:['c1','c2']}},
    {id:'j3',title:'Birding at Zhongshan Park',date:'2026-07-20',body:'Observed Dendrocopos major and Aegithalos caudatus. The woodpecker\'s drumming carried across the park. The long-tailed tits moved in a restless flock through the canopy.',tags:['birding','field-notes'],rels:{projects:['p2'],concepts:['c4']}}],
  reading:[{id:'r1',type:'book',title:'Cultural Geography',creator:'Mike Crang',status:'reading',rating:4,date:'2026-07',tags:['geography','theory'],notes:'Core argument: space becomes place through human experience and representation.',highlights:['"Place is not just a setting for events but is continually being created and recreated through people\'s experience and description of it."'],projects:['p1'],concepts:['c1','c2']},
    {id:'r2',type:'book',title:'One Hundred Years of Solitude',creator:'Gabriel García Márquez',status:'read',rating:5,date:'2026-06',tags:['fiction','magical-realism'],notes:'Macondo is not merely a fictional town—it is a mythic space condensing the history of a continent.',highlights:['"Many years later, as he faced the firing squad, Colonel Aureliano Buendía was to remember that distant afternoon when his father took him to discover ice."'],projects:['p1'],concepts:['c2']},
    {id:'r3',type:'book',title:'A Field Guide to Chinese Birds',creator:'Liu Yang',status:'reading',rating:0,date:'2026-07',tags:['ornithology'],notes:'Comprehensive guide to 1400+ species. Essential for field identification.',projects:['p2'],concepts:['c4']}],
  project:[{id:'p1',title:'Cultural Geography',icon:'◇',desc:'The study of cultural phenomena distributed across space, their diffusion, and their relationship with the physical environment.',tags:['geography','culture','theory'],created:'2026-07-20',
    tree:[{n:'Core Concepts',c:[{n:'Space & Place'},{n:'Landscape'},{n:'Cultural Turn'},{n:'Scale'}]},{n:'Key Scholars',c:[{n:'Carl Sauer'},{n:'Yi-Fu Tuan'},{n:'Edward Soja'},{n:'Mike Crang'}]},{n:'Related Fields',c:[{n:'Human Geography'},{n:'Urban Studies'},{n:'Literary Geography'}]}],
    readings:['r1','r2'],concepts:['c1','c2'],journal:['j1','j2'],resources:[]},
    {id:'p2',title:'Birding & Ornithology',icon:'◇',desc:'Systematic observation and study of wild birds: identification, behaviour, ecology, and conservation.',tags:['birds','ecology','fieldwork'],created:'2026-07-18',
    tree:[{n:'Taxonomy',c:[{n:'Passeriformes'},{n:'Piciformes'},{n:'Falconiformes'}]},{n:'Field Skills',c:[{n:'Identification'},{n:'Song Recognition'},{n:'Recording'}]},{n:'Local Species',c:[{n:'Forest Birds'},{n:'Waterfowl'},{n:'Raptors'}]}],
    readings:['r3'],concepts:['c4'],journal:['j3'],resources:[]}],
  concept:[{id:'c1',title:'Place',definition:'A meaningful segment of geographic space. Unlike abstract "space," place is invested with human experience, memory, and significance.',background:'The concept of place gained prominence in human geography in the 1970s, notably through the work of Yi-Fu Tuan and Edward Relph.',tags:['geography','theory'],rels:{reading:['r1','r2'],projects:['p1'],journal:['j2'],concepts:['c2','c3']}},

function renderGraph(mc){
  const all=[...DATA.project,...DATA.concept,...DATA.reading.filter(r=>r.rating>=4)]
  const cx=350,cy=220,r=170
  mc.innerHTML=`<div class="page-h"><h1>Knowledge Graph</h1></div>
  <div class="graph-container" id="gc"><svg viewBox="0 0 700 440" id="gsvg"></svg><div class="graph-info" id="ginfo"></div></div>`
  setTimeout(()=>drawGraph(all,cx,cy,r),50)
}
function drawGraph(nodes,cx,cy,r){
  const svg=document.getElementById('gsvg')
  const colors={project:'var(--accent)',concept:'var(--primary)',reading:'var(--border)'}
  const angles=nodes.map((_,i)=>2*Math.PI*i/nodes.length-Math.PI/2)
  const pos=angles.map(a=>({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}))
  let l='',c='',t=''
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const connected=Math.random()>.7
    if(connected)l+=`<line x1="${pos[i].x}" y1="${pos[i].y}" x2="${pos[j].x}" y2="${pos[j].y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,2" opacity=".6"/>`
  }
  nodes.forEach((n,i)=>{
    const col=n.type==='project'?colors.project:n.type==='concept'?colors.concept:colors.reading
    const sz=n.type==='project'?10:n.type==='concept'?7:5
    c+=`<g class="kg-node" style="cursor:pointer" onclick="showGraphInfo('${n.id}')"><circle cx="${pos[i].x}" cy="${pos[i].y}" r="${sz}" fill="${col}" stroke="#fff" stroke-width="1.5" opacity=".85"/></g>`
    t+=`<text x="${pos[i].x}" y="${pos[i].y+16}" text-anchor="middle" font-size="9" fill="var(--secondary)" font-family="var(--font-sans)">${esc(n.title||'').slice(0,10)}</text>`
  })
  svg.innerHTML=l+c+t
}
function showGraphInfo(id){
  const d=byId(id);if(!d)return
  const el=document.getElementById('ginfo')
  let rels=[]
  if(d.rels?.reading)rels.push(...d.rels.reading.map(rid=>{const r=byId(rid);return r?esc(r.title):''}).filter(Boolean))
  if(d.rels?.projects)rels.push(...d.rels.projects.map(pid=>{const p=byId(pid);return p?esc(p.title):''}).filter(Boolean))
  if(d.rels?.journal)rels.push(...d.rels.journal.map(jid=>{const j=byId(jid);return j?esc(j.title):''}).filter(Boolean))
  if(d.rels?.concepts)rels.push(...d.rels.concepts.map(cid=>{const c=byId(cid);return c?esc(c.title):''}).filter(Boolean))
  el.innerHTML=`<div class="gi-title">${esc(d.title)}</div><div class="gi-type">${d.type||d.constructor?.name||'item'}</div>${d.definition?`<div class="gi-body">${esc(d.definition).slice(0,100)}</div>`:d.desc?`<div class="gi-body">${esc(d.desc).slice(0,100)}</div>`:d.notes?`<div class="gi-body">${esc(d.notes).slice(0,100)}</div>`:''}${rels.length?`<div class="gi-links">${rels.slice(0,5).map(r=>`<span onclick="openDetail('concept','${id}')">${r}</span>`).join('')}</div>`:''}`
  el.classList.add('show')
}
document.addEventListener('click',e=>{if(!e.target.closest('.kg-node')&&!e.target.closest('.graph-info'))document.getElementById('ginfo')?.classList.remove('show')})

function doSearch(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim()
  const res=document.getElementById('searchResults')
  if(!q){res.innerHTML='<div style="padding:16px 0;font-size:12px;color:var(--secondary)">Type to search…</div>';return}
  let results=[]
  Object.entries(DATA).forEach(([type,items])=>{items.forEach(item=>{if((item.title||'').toLowerCase().includes(q)||(item.body||'').toLowerCase().includes(q)||(item.notes||'').toLowerCase().includes(q)||(item.definition||'').toLowerCase().includes(q)||(item.tags||[]).join(' ').toLowerCase().includes(q))results.push({type,id:item.id,title:item.title,sub:item.type||item.level||item.date||''})})})
  results=results.slice(0,12)
  res.innerHTML=results.length?results.map(r=>{
    const navMap={journal:'journal',reading:'reading',project:'project',concept:'concept'}
    const navType=navMap[r.type]||'home'
    return`<div class="card" style="margin-bottom:4px;padding:10px 14px" onclick="closeSearch();${navType==='project'?`navigateToProject('${r.id}')`:`openDetail('${navType}','${r.id}')`}"><div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-family:var(--font-sans);font-size:13px">${esc(r.title)}</h3><span style="font-size:9px;color:var(--secondary)">${r.type}</span></div></div>`

function confirmAdd(){
  const tp=document.getElementById('aType').value;const t=document.getElementById('aT')?.value.trim()
  if(!t)return;const id=tp.charAt(0)+Date.now()
  let item={id,title:t,tags:[],createdAt:new Date().toISOString(),rels:{}}
  if(tp==='journal'){item.date=new Date().toISOString().slice(0,10);item.body=document.getElementById('aB')?.value.trim()||''}
  else if(tp==='reading'){item.type=document.getElementById('aST')?.value||'book';item.creator=document.getElementById('aC')?.value.trim()||'';item.tags=document.getElementById('aTg')?.value.split(',').map(s=>s.trim()).filter(Boolean)||[];item.notes='';item.highlights=[]}
  else if(tp==='project'){item.icon='◇';item.desc=document.getElementById('aD')?.value.trim()||'';item.tree=[];item.readings=[];item.concepts=[];item.journal=[]}
  else if(tp==='concept'){item.definition=document.getElementById('aD')?.value.trim()||'';item.background=''}
  else if(tp==='skill'){item.level=document.getElementById('aL')?.value||'beginner';item.progress=0;item.status='learning';item.practices=[]}
  const key=KEYS[tp]||(tp+'s');if(!DATA[key])DATA[key]=[];DATA[key].push(item);persist();closeAdd();render()
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){const modals=['searchModal','importModal','addModal'];modals.forEach(m=>{const el=document.getElementById(m);if(el&&el.classList.contains('show'))el.classList.remove('show')});document.body.style.overflow=''}})
render()
</script>
</body>
