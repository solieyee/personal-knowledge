<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究工作室</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
/* ═════════════════════════════════════
   Swiss Editorial Design System
   Museum Archive · Research Journal
   ═════════════════════════════════════ */
:root{
  --paper:#F6F4EF;
  --ink:#1E1E1E;
  --ink-light:#7A7570;
  --ink-dim:#B0ABA4;
  --accent:#6B7F5B;
  --rule:#D6D0C8;
  --rule-light:#E6E2DA;
  --font-serif:'Libre Baskerville','Cormorant Garamond',Georgia,serif;
  --font-sans:'Inter',-apple-system,sans-serif;
  --grid:12;
  --col:60px;
  --gutter:20px;
  --reading:680px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.7;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:var(--rule);border-radius:1px}

/* ── 12-Column Grid Container ── */
.app{display:flex;flex-direction:column;height:100vh}

/* ── Navigation / Top Rule ── */
.nav{display:flex;align-items:center;padding:0 48px;height:44px;border-bottom:1px solid var(--rule);background:var(--paper);flex-shrink:0;gap:0;position:relative;z-index:10}
.nav-logo{font-family:var(--font-serif);font-size:13px;font-weight:400;color:var(--ink);letter-spacing:.02em;margin-right:28px;opacity:.6;cursor:default}
.nav a{display:inline-flex;align-items:center;gap:4px;padding:0 12px;height:44px;text-decoration:none;color:var(--ink-light);font-size:11px;font-weight:400;cursor:pointer;transition:all .12s;font-family:inherit;border:none;background:transparent;letter-spacing:.03em;position:relative}
.nav a:hover{color:var(--ink);opacity:1}
.nav a.active{color:var(--ink)}
.nav a.active::after{content:'';position:absolute;bottom:-1px;left:12px;right:12px;height:1px;background:var(--ink)}
.nav .spacer{flex:1}
.nav .search-btn{display:inline-flex;align-items:center;gap:4px;padding:0 10px;height:28px;border:1px solid var(--rule);background:transparent;color:var(--ink-light);font-size:10px;font-family:inherit;cursor:pointer;letter-spacing:.03em;transition:all .12s;border-radius:0}
.nav .search-btn:hover{border-color:var(--ink);color:var(--ink)}
.nav .search-btn svg{width:12px;height:12px}

/* ── Content Area ── */
.main{flex:1;overflow-y:auto;padding:0}
.main::-webkit-scrollbar{width:2px}.main::-webkit-scrollbar-thumb{background:var(--rule);border-radius:1px}

/* ── Reading Layout (680px centered) ── */
.reading{max-width:var(--reading);margin:0 auto;padding:48px 24px 80px}
.reading-wide{max-width:880px;margin:0 auto;padding:48px 24px 80px}

/* ── Editorial Typography ── */
.ed-h1{font-family:var(--font-serif);font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin-bottom:6px}
.ed-h2{font-family:var(--font-serif);font-size:20px;font-weight:600;line-height:1.3;margin-bottom:4px;margin-top:32px}
.ed-h3{font-family:var(--font-serif);font-size:16px;font-weight:600;line-height:1.4;margin-bottom:3px;margin-top:24px}
.ed-body{font-size:14px;line-height:1.8;color:var(--ink);font-weight:300}
.ed-body p{margin-bottom:10px}
.ed-meta{font-size:10px;color:var(--ink-light);letter-spacing:.05em;font-weight:400}
.ed-caption{font-size:11px;color:var(--ink-light);font-weight:300;font-style:italic}
.ed-section-num{font-size:9px;color:var(--ink-dim);letter-spacing:.1em;font-weight:500;margin-bottom:2px}
.ed-rule{border:none;border-top:1px solid var(--rule);margin:28px 0}
.ed-rule-light{border:none;border-top:1px solid var(--rule-light);margin:20px 0}
.ed-blockquote{border-left:1px solid var(--accent);padding:4px 16px;margin:12px 0;font-family:var(--font-serif);font-style:italic;color:var(--ink-light);font-size:13px;line-height:1.7}
.ed-label{font-size:9px;color:var(--ink-light);letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:6px}

/* ── Page Header ── */
.page-h{padding-bottom:20px;margin-bottom:32px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-end;justify-content:space-between}
.page-h .left{flex:1}
.page-h .ed-section-num{margin-bottom:2px}
.page-h .count{font-size:10px;color:var(--ink-dim);letter-spacing:.05em}

/* ── Home ── */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;row-gap:32px;column-gap:40px;margin-top:8px}
.home-section{border-top:1px solid var(--rule-light);padding-top:16px}
.home-section .hs-title{font-size:9px;color:var(--ink-light);letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:8px}
.home-entry{display:block;padding:6px 0;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;font-size:13px;line-height:1.5;color:var(--ink);border-bottom:1px solid var(--rule-light);transition:all .12s}
.home-entry:hover{color:var(--accent)}
.home-entry:last-child{border-bottom:none}
.home-entry .he-date{font-size:10px;color:var(--ink-dim);margin-top:.5px}
.home-entry .he-type{font-size:9px;color:var(--ink-light);letter-spacing:.05em}

/* ── Journal Timeline ── */
.tl{max-width:var(--reading);margin:0 auto;padding:40px 24px 80px}
.tl-entry{border-bottom:1px solid var(--rule-light);padding:24px 0;cursor:pointer;transition:all .12s}
.tl-entry:hover{border-bottom-color:var(--accent)}
.tl-entry:first-child{padding-top:0}
.tl-entry .tl-date{font-size:9px;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.tl-entry .tl-title{font-family:var(--font-serif);font-size:17px;font-weight:600;margin-bottom:3px;line-height:1.3}
.tl-entry .tl-body{font-size:13px;color:var(--ink-light);line-height:1.7;font-weight:300;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-entry .tl-links{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tl-entry .tl-links span{font-size:10px;color:var(--accent);cursor:pointer;transition:all .1s}
.tl-entry .tl-links span:hover{text-decoration:underline}

/* ── Reading List (Apple Books style) ── */
.reading-list{max-width:var(--reading);margin:0 auto;padding:40px 24px 80px}
.rl-item{display:block;padding:16px 0;border-bottom:1px solid var(--rule-light);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.rl-item:hover .rl-title{color:var(--accent)}
.rl-item:first-child{padding-top:0}
.rl-item .rl-type{font-size:9px;color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:1px}
.rl-item .rl-title{font-family:var(--font-serif);font-size:16px;font-weight:600;margin-bottom:1px;transition:color .12s}
.rl-item .rl-meta{font-size:11px;color:var(--ink-light);font-weight:300}
.rl-item .rl-excerpt{font-size:12px;color:var(--ink-light);line-height:1.6;font-weight:300;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── Project Card (minimal list) ── */
.project-list{max-width:var(--reading);margin:0 auto;padding:40px 24px 80px}
.pl-item{display:block;padding:14px 0;border-bottom:1px solid var(--rule-light);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.pl-item:hover .pl-title{color:var(--accent)}
.pl-item .pl-icon{font-size:10px;color:var(--ink-dim);margin-bottom:1px}
.pl-item .pl-title{font-family:var(--font-serif);font-size:16px;font-weight:600;margin-bottom:1px;transition:color .12s}
.pl-item .pl-desc{font-size:12px;color:var(--ink-light);font-weight:300;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ── Concept List ── */
.concept-list{max-width:var(--reading);margin:0 auto;padding:40px 24px 80px}
.cl-item{display:block;padding:12px 0;border-bottom:1px solid var(--rule-light);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.cl-item:hover .cl-title{color:var(--accent)}
.cl-item .cl-title{font-family:var(--font-serif);font-size:15px;font-weight:600;margin-bottom:1px;transition:color .12s}
.cl-item .cl-def{font-size:12px;color:var(--ink-light);font-weight:300;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cl-item .cl-tags{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.cl-item .cl-tags span{font-size:9px;color:var(--ink-dim)}

/* ── Detail Page (magazine spread) ── */
.detail-page{max-width:var(--reading);margin:0 auto;padding:48px 24px 80px}
.detail-page .dp-back{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-light);cursor:pointer;margin-bottom:24px;border:none;background:transparent;font-family:inherit;padding:0;letter-spacing:.05em;transition:color .12s}
.detail-page .dp-back:hover{color:var(--ink)}
.detail-page .dp-h{margin-bottom:24px}
.detail-page .dp-meta{font-size:10px;color:var(--ink-dim);letter-spacing:.05em;display:flex;gap:12px}

/* ─── Project Detail (Wikipedia style) ─── */
.pd-section{margin-bottom:28px}
.pd-section .pd-title{font-family:var(--font-serif);font-size:18px;font-weight:600;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px}
.pd-section .pd-body{font-size:13px;color:var(--ink);line-height:1.8;font-weight:300}
.pd-section .pd-body p{margin-bottom:8px}

/* ─── Concept Detail (two column) ─── */
.cd-grid{display:grid;grid-template-columns:1fr 220px;gap:40px;max-width:880px;margin:0 auto;padding:48px 24px 80px}
.cd-main{min-width:0}
.cd-side{min-width:0}
.cd-side .cd-widget{margin-bottom:24px}
.cd-side .cd-widget .cdw-title{font-size:9px;color:var(--ink-light);letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--rule-light)}
.cd-side .cd-widget .cdw-item{display:block;padding:3px 0;font-size:12px;color:var(--ink);cursor:pointer;transition:color .12s;border:none;background:none;font-family:inherit;text-align:left}
.cd-side .cd-widget .cdw-item:hover{color:var(--accent)}
.stars{display:inline-flex;gap:1px;font-size:10px}.stars .f{color:var(--ink)}.stars .e{color:var(--ink-dim)}

/* ── Graph ── */
.graph-wrap{max-width:880px;margin:0 auto;padding:40px 24px 80px}
.graph-container{background:var(--paper);border:1px solid var(--rule);padding:24px;position:relative;min-height:360px}
.graph-container svg{width:100%;height:100%;min-height:360px}
.graph-info{position:absolute;right:16px;top:16px;width:200px;background:var(--paper);border:1px solid var(--rule);padding:12px 14px;display:none}
.graph-info.show{display:block}
.graph-info .gi-title{font-family:var(--font-serif);font-size:14px;font-weight:600;margin-bottom:1px}
.graph-info .gi-type{font-size:9px;color:var(--ink-light);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.graph-info .gi-body{font-size:11px;color:var(--ink-light);line-height:1.5;margin-bottom:3px}
.graph-info .gi-links{display:flex;gap:2px;flex-wrap:wrap}
.graph-info .gi-links span{font-size:9px;color:var(--accent);cursor:pointer}
.graph-info .gi-links span:hover{text-decoration:underline}

/* ── Modal ── */
.mo{display:none;position:fixed;inset:0;background:rgba(30,30,30,.08);z-index:200;align-items:center;justify-content:center;padding:16px}
.mo.show{display:flex}
.mm{background:var(--paper);border:1px solid var(--rule);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:24px 28px;animation:mi .2s ease-out}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mm h2{font-family:var(--font-serif);font-size:18px;font-weight:600;margin-bottom:2px}
.mm .ms{font-size:11px;color:var(--ink-light);margin-bottom:14px}
.mm .cl{float:right;background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink-dim);line-height:1;transition:color .12s}
.mm .cl:hover{color:var(--ink)}
.f2{display:flex;gap:6px;margin-bottom:6px}
.f2 .fd{flex:1}
.f2 .fd label{font-size:9px;color:var(--ink-light);margin-bottom:2px;display:block;letter-spacing:.05em;font-weight:500}
.f2 .fd input,.f2 .fd select,.f2 .fd textarea{width:100%;padding:6px 10px;border:1px solid var(--rule);font-size:12px;font-family:inherit;background:transparent;transition:all .12s;color:var(--ink)}
.f2 .fd input:focus,.f2 .fd select:focus,.f2 .fd textarea:focus{outline:none;border-color:var(--ink)}
.f2 .fd textarea{resize:vertical;min-height:30px}
.mm .sub{width:100%;padding:6px;background:none;color:var(--ink);border:1px solid var(--rule);font-size:11px;font-family:inherit;cursor:pointer;font-weight:400;margin-top:4px;transition:all .12s;letter-spacing:.05em}
.mm .sub:hover{border-color:var(--ink)}

/* ── Tree ── */
.tree{list-style:none;padding:0}.tree li{margin:0}
.tree-node{display:flex;align-items:center;gap:4px;padding:3px 0;cursor:pointer;transition:all .1s;font-size:12px;color:var(--ink-light)}
.tree-node:hover{color:var(--ink)}
.tree-node .toggle{width:10px;height:10px;display:flex;align-items:center;justify-content:center;font-size:5px;color:var(--ink-dim);cursor:pointer;transition:transform .15s;flex-shrink:0}
.tree-node .toggle.exp{transform:rotate(90deg)}
.tree-node .tt{flex:1;font-size:12px}
.tree-children{padding-left:14px;display:none}.tree-children.open{display:block}

/* ── Utilities ── */
.empty{text-align:center;padding:48px 16px;color:var(--ink-dim);font-size:12px;font-weight:300}
.welcome{font-family:var(--font-serif);font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px;line-height:1.2}
.welcome-sub{font-size:12px;color:var(--ink-light);font-weight:300;margin-bottom:0}

/* ── Responsive ── */
@media(max-width:768px){
  .nav{padding:0 16px;overflow-x:auto}
  .nav a{white-space:nowrap;padding:0 8px;font-size:10px}
  .nav-logo{font-size:12px;margin-right:14px}
  .reading{padding:32px 16px 60px}
  .reading-wide{padding:32px 16px 60px}
  .tl{padding:32px 16px 60px}
  .reading-list{padding:32px 16px 60px}
  .project-list{padding:32px 16px 60px}
  .concept-list{padding:32px 16px 60px}
  .detail-page{padding:32px 16px 60px}
  .cd-grid{grid-template-columns:1fr;gap:24px;padding:32px 16px 60px}
  .graph-wrap{padding:32px 16px 60px}
  .home-grid{grid-template-columns:1fr;column-gap:0}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="nav-logo">研究工作室</div>
    <a class="active" data-p="home">首页</a>
    <a data-p="journal">日记</a>
    <a data-p="reading">阅读</a>
    <a data-p="project">课题</a>
    <a data-p="concept">概念</a>
    <a data-p="graph">图谱</a>
    <div class="spacer"></div>
    <button class="search-btn" onclick="showSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>搜索</button>
    <button class="search-btn" style="margin-left:4px" onclick="showImport()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导入</button>
    <button class="search-btn" style="margin-left:4px" onclick="showAdd()">＋ 新建</button>
  </nav>
  <div class="main" id="main"></div>
</div>

<div class="mo" id="searchModal" onclick="if(event.target===this)closeSearch()">
  <div class="mm" style="max-width:560px" onclick="event.stopPropagation()">
    <div class="f2"><div class="fd"><input id="searchInput" placeholder="搜索研究工作室…" style="font-size:14px;padding:10px 14px" autofocus oninput="doSearch()"></div></div>
    <div id="searchResults" style="max-height:400px;overflow-y:auto"></div>
  </div>
</div>

<div class="mo" id="importModal" onclick="if(event.target===this)closeImport()">
  <div class="mm" onclick="event.stopPropagation()">
    <button class="cl" onclick="closeImport()">✕</button>
    <h2>导入链接</h2>
    <p class="ms">粘贴链接，AI 自动分析并索引</p>
    <div class="f2"><div class="fd"><input id="importUrl" placeholder="https://…" style="font-size:13px"></div></div>
    <button class="sub" onclick="doImport()">分析</button>
    <div id="importResult" style="margin-top:8px;display:none"></div>
  </div>
</div>

<div class="mo" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="mm" onclick="event.stopPropagation()">
    <button class="cl" onclick="closeAdd()">✕</button>
    <h2>新建</h2>
    <p class="ms">选择类型开始记录</p>
    <div class="f2"><div class="fd"><label>类型</label><select id="aType" onchange="buildAddForm()"><option value="journal">日记</option><option value="reading">阅读</option><option value="project">课题</option><option value="concept">概念</option><option value="skill">技能</option></select></div></div>
    <div id="addForm"></div>
    <button class="sub" onclick="confirmAdd()">创建</button>
  </div>
</div>

<script>
const DATA={
  journal:[{id:'j1',title:'开始搭建研究工作室',date:'2026-07-25',body:'今天开始构建个人研究工作室——一个用于长期阅读、研究和写作的空间。系统以六大模块为核心：日记、阅读、课题、概念、技能和图谱。',tags:['研究','知识管理'],rels:{projects:['p1'],concepts:['c3']}},
    {id:'j2',title:'文化地理学笔记',date:'2026-07-22',body:'空间与地方的区分是基础性的。空间是抽象的、几何的；地方是被经验、被赋予意义的。每一处景观都承载着塑造它的文化痕迹。',tags:['地理','文化'],rels:{projects:['p1'],reading:['r1'],concepts:['c1','c2']}},
    {id:'j3',title:'中山公园观鸟',date:'2026-07-20',body:'观察到一只大斑啄木鸟和一群银喉长尾山雀。啄木鸟的敲击声传得很远。长尾山雀在树冠中不停地跳动。',tags:['观鸟','野外记录'],rels:{projects:['p2'],concepts:['c4']}}],
  reading:[{id:'r1',type:'book',title:'文化地理学',creator:'迈克·克朗',status:'reading',rating:4,date:'2026-07',tags:['地理','理论'],notes:'核心论点：空间通过人的体验和再现被不断创造为地方。',highlights:['"地方不仅是事件的背景，而是通过人们对它的体验和描述被不断创造和重塑的。"'],projects:['p1'],concepts:['c1','c2']},
    {id:'r2',type:'book',title:'百年孤独',creator:'加西亚·马尔克斯',status:'read',rating:5,date:'2026-06',tags:['小说','魔幻现实'],notes:'马孔多不仅是一个虚构的城镇，更是一个浓缩了整个拉丁美洲历史的神话空间。',highlights:['"多年以后，面对行刑队，奥雷里亚诺·布恩迪亚上校将会回想起父亲带他去见识冰块的那个遥远的下午。"'],projects:['p1'],concepts:['c2']},
    {id:'r3',type:'book',title:'中国鸟类观察手册',creator:'刘阳',status:'reading',rating:0,date:'2026-07',tags:['鸟类'],notes:'记录了中国1400余种鸟类。对于野外识别很有帮助。',projects:['p2'],concepts:['c4']}],
  project:[{id:'p1',title:'文化地理学',icon:'◇',desc:'研究文化现象在空间中的分布、传播及其与地理环境的关系。',tags:['地理','文化','理论'],created:'2026-07-20',

function renderGraph(mc){const all=[...DATA.project,...DATA.concept,...DATA.reading.filter(r=>r.rating>=4)];const cx=350,cy=220,r=170
  mc.innerHTML=`<div class="graph-wrap"><div class="page-h" style="padding-bottom:16px;margin-bottom:0"><div class="left"><div class="ed-section-num">GRAPH · 05</div><div class="ed-h1" style="font-size:24px">知识图谱</div></div></div><div class="graph-container" id="gc"><svg viewBox="0 0 700 440" id="gsvg"></svg><div class="graph-info" id="ginfo"></div></div></div>`
  setTimeout(()=>{const svg=document.getElementById('gsvg');const colors={project:'var(--ink)',concept:'var(--accent)',reading:'var(--ink-dim)'};const angles=all.map((_,i)=>2*Math.PI*i/all.length-Math.PI/2);const pos=angles.map(a=>({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}));let l='',c='',t='';for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){if(Math.random()>.7)l+=`<line x1="${pos[i].x}" y1="${pos[i].y}" x2="${pos[j].x}" y2="${pos[j].y}" stroke="var(--rule)" stroke-width="1"/>`}all.forEach((n,i)=>{const col=n.type==='project'?colors.project:n.type==='concept'?colors.concept:colors.reading;const sz=n.type==='project'?8:n.type==='concept'?6:4;c+=`<g style="cursor:pointer" onclick="showGraphInfo('${n.id}')"><circle cx="${pos[i].x}" cy="${pos[i].y}" r="${sz}" fill="${col}" opacity=".85"/></g>`;t+=`<text x="${pos[i].x}" y="${pos[i].y+14}" text-anchor="middle" font-size="8" fill="var(--ink-light)" font-family="var(--font-sans)">${esc(n.title||'').slice(0,8)}</text>`});svg.innerHTML=l+c+t},50)
}

  if(tp==='skill'){document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>技能</label><input id="aT"></div><div class="fd"><label>等级</label><select id="aL"><option value="beginner">初级</option><option value="intermediate">中级</option><option value="advanced">高级</option></select></div></div>`}
}
function confirmAdd(){const tp=document.getElementById('aType').value;const t=document.getElementById('aT')?.value.trim();if(!t)return;const id=tp.charAt(0)+Date.now();let item={id,title:t,tags:[],createdAt:new Date().toISOString(),rels:{}}
  if(tp==='journal'){item.date=new Date().toISOString().slice(0,10);item.body=document.getElementById('aB')?.value.trim()||''}
  else if(tp==='reading'){item.type=document.getElementById('aST')?.value||'book';item.creator=document.getElementById('aC')?.value.trim()||'';item.tags=document.getElementById('aTg')?.value.split(',').map(s=>s.trim()).filter(Boolean)||[];item.notes='';item.highlights=[]}
  else if(tp==='project'){item.icon='◇';item.desc=document.getElementById('aD')?.value.trim()||'';item.tree=[];item.readings=[];item.concepts=[];item.journal=[]}
  else if(tp==='concept'){item.definition=document.getElementById('aD')?.value.trim()||'';item.background=''}
  else if(tp==='skill'){item.level=document.getElementById('aL')?.value||'beginner';item.progress=0;item.status='learning';item.practices=[]}
  if(!DATA[tp])DATA[tp]=[];DATA[tp].push(item);persist();closeAdd();render()
}
render()
</script>
