<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知屿 · Knowls</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf8f5;--surface:#fff;--cream:#f5f0eb;--sage:#d4dcd4;--sage-light:#edf2ed;--sage-dark:#7a9a7a;--text:#2c2c2c;--t2:#6b6b6b;--t3:#9a9a9a;--accent:#7a9a7a;--al:#edf2ed;--border:#e8e4de;--border2:#ddd8d0;--radius-sm:8px;--radius-md:14px;--radius-lg:20px;--shadow-sm:0 1px 4px rgba(0,0,0,.04);--shadow-md:0 4px 16px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.08);--star:#d4a043;--font-serif:'Noto Serif SC',Georgia,serif;--font-sans:'Inter','Noto Sans SC',-apple-system,sans-serif}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;color-scheme:light}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── Layout ── */
.app{display:flex;flex-direction:column;height:100vh}

/* ── Navigation ── */
.nav{display:flex;align-items:center;padding:0 32px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;gap:4px}
.nav .logo{font-family:var(--font-serif);font-size:17px;font-weight:700;color:var(--sage-dark);margin-right:24px;letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
.nav .logo span{font-size:20px}
.nav a{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);text-decoration:none;color:var(--t2);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit;border:none;background:transparent}
.nav a:hover{background:var(--cream);color:var(--text)}
.nav a.active{background:var(--sage-light);color:var(--sage-dark);font-weight:600}
.nav .spacer{flex:1}
.nav .add-btn{padding:6px 16px;border-radius:20px;border:none;background:var(--sage-dark);color:#fff;font-size:12px;font-family:inherit;cursor:pointer;font-weight:500;transition:all .15s}
.nav .add-btn:hover{opacity:.85}
@media(max-width:860px){.nav{padding:0 16px;overflow-x:auto}.nav a{white-space:nowrap;padding:6px 10px;font-size:12px}.nav .logo{margin-right:12px;font-size:15px}}

/* ── Main Content ── */
.main{flex:1;overflow-y:auto;padding:28px 32px 60px;max-width:960px;margin:0 auto;width:100%}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:860px){.main{padding:20px 16px 60px}}

/* ── Home Dashboard ── */
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.home-grid .full{grid-column:1/-1}
.home-card{background:var(--surface);border-radius:var(--radius-md);padding:20px;border:1px solid var(--border);transition:all .2s;cursor:pointer}
.home-card:hover{border-color:var(--sage);box-shadow:var(--shadow-md)}
.home-card .hc-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.home-card .hc-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;transition:all .1s}
.home-card .hc-item:last-child{border-bottom:none}
.home-card .hc-item:hover{color:var(--sage-dark)}
.home-card .hc-item .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.home-card .hc-item .dot.j{background:var(--sage-dark)}.home-card .hc-item .dot.r{background:#8ab4d8}.home-card .hc-item .dot.p{background:#d4a043}.home-card .hc-item .dot.s{background:#c48ab8}
.home-card .hc-item .sub{font-size:11px;color:var(--t3)}
.entry-circles{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.entry-circle{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;transition:all .15s;padding:12px 16px;border-radius:var(--radius-md);background:var(--cream);min-width:80px}
.entry-circle:hover{background:var(--sage-light);transform:translateY(-2px)}
.entry-circle .ec-icon{font-size:24px;line-height:1}
.entry-circle .ec-label{font-size:11px;color:var(--t2);font-weight:500}

/* ── Journal Timeline ── */
.journal-tl{position:relative;padding-left:32px}
.journal-tl::before{content:'';position:absolute;left:13px;top:8px;bottom:8px;width:2px;background:var(--sage)}
.jt-entry{position:relative;margin-bottom:20px}
.jt-entry::before{content:'';position:absolute;left:-24px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--sage-dark);box-shadow:0 0 0 4px var(--sage-light)}
.jt-date{font-size:11px;color:var(--t3);font-weight:500;margin-bottom:4px;letter-spacing:.3px}
.jt-card{background:var(--surface);border-radius:var(--radius-md);padding:20px 22px;border:1px solid var(--border);transition:all .2s;cursor:pointer}
.jt-card:hover{border-color:var(--sage);box-shadow:var(--shadow-md)}
.jt-card h3{font-family:var(--font-serif);font-size:17px;font-weight:600;margin-bottom:4px}
.jt-card .jt-body{font-size:14px;color:var(--t2);line-height:1.8;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.jt-card .jt-links{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.jt-card .jt-links span{font-size:11px;padding:2px 10px;border-radius:12px;background:var(--sage-light);color:var(--sage-dark);cursor:pointer;transition:all .1s}
.jt-card .jt-links span:hover{background:var(--sage);color:var(--text)}

/* ── Reading Grid ── */
.reading-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.r-card{background:var(--surface);border-radius:var(--radius-md);padding:18px 20px;border:1px solid var(--border);transition:all .2s;cursor:pointer}
.r-card:hover{border-color:var(--sage);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.r-card .r-type{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.r-card h3{font-family:var(--font-serif);font-size:15px;font-weight:600;margin-bottom:2px}
.r-card .r-meta{font-size:12px;color:var(--t2);margin-bottom:3px}
.r-card .r-excerpt{font-size:12px;color:var(--t2);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{display:inline-flex;gap:1px;font-size:11px}
.stars .f{color:var(--star)}.stars .e{color:#e5e5ea}
.r-card .r-tags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.r-card .r-tags span{font-size:10px;padding:1px 8px;border-radius:8px;background:var(--cream);color:var(--t2)}
.r-card .r-links{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.r-card .r-links span{font-size:10px;padding:1px 8px;border-radius:8px;background:var(--sage-light);color:var(--sage-dark)}

/* ── Project Detail ── */
.p-hero{background:var(--cream);border-radius:var(--radius-lg);padding:28px 32px;margin-bottom:16px;display:flex;gap:16px;align-items:flex-start}
.p-hero .pi{font-size:36px;flex-shrink:0}
.p-hero .pt{font-family:var(--font-serif);font-size:22px;font-weight:700;margin-bottom:2px}
.p-hero .pd{font-size:13px;color:var(--t2);line-height:1.6}
.p-tabs{display:flex;gap:2px;margin-bottom:16px;border-bottom:1px solid var(--border)}
.p-tabs button{padding:8px 18px;border:none;background:transparent;cursor:pointer;font-size:13px;font-family:inherit;color:var(--t2);border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px}
.p-tabs button:hover{color:var(--text)}
.p-tabs button.active{color:var(--sage-dark);border-bottom-color:var(--sage-dark);font-weight:500}

/* Tree View */
.tree{list-style:none;padding-left:0}
.tree li{margin:2px 0}
.tree .tree-node{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:all .12s;font-size:13px}
.tree .tree-node:hover{background:var(--cream)}
.tree .tree-node .toggle{width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--t3);cursor:pointer;flex-shrink:0;transition:transform .15s}
.tree .tree-node .toggle.expanded{transform:rotate(90deg)}
.tree .tree-node .t-icon{font-size:12px;width:18px;text-align:center;flex-shrink:0}
.tree .tree-node .t-title{flex:1}
.tree .tree-node .t-count{font-size:10px;color:var(--t3);background:var(--cream);padding:0 7px;border-radius:8px}
.tree .children{padding-left:22px;display:none}
.tree .children.open{display:block}

/* ── Skills Panel ── */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.s-card{background:var(--surface);border-radius:var(--radius-md);padding:18px 20px;border:1px solid var(--border);transition:all .2s;cursor:pointer}
.s-card:hover{border-color:var(--sage);box-shadow:var(--shadow-md)}
.s-card .shd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.s-card .shd .sn{font-family:var(--font-serif);font-size:15px;font-weight:600}
.s-card .shd .slv{font-size:10px;padding:2px 10px;border-radius:12px;background:var(--sage-light);color:var(--sage-dark)}
.s-card .sbar{height:5px;border-radius:3px;background:var(--cream);overflow:hidden;margin-top:6px}
.s-card .sbar .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--sage),var(--sage-dark))}
.s-card .smeta{display:flex;gap:12px;margin-top:4px;font-size:11px;color:var(--t2)}
.s-card .stags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.s-card .stags span{font-size:10px;padding:1px 7px;border-radius:6px;background:var(--cream);color:var(--t2)}

/* ── Knowledge Graph ── */
.kg-container{position:relative;min-height:500px;background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);padding:24px;overflow:hidden}
.kg-container svg{width:100%;height:100%;min-height:500px}
.kg-node{cursor:pointer;transition:all .2s}
.kg-node:hover .kg-label{fill:var(--sage-dark);font-weight:600}
.kg-node:hover .kg-circle{stroke:var(--sage-dark);stroke-width:2.5}
.kg-info{position:absolute;right:24px;top:24px;width:260px;background:var(--surface);border-radius:var(--radius-md);padding:16px 18px;border:1px solid var(--border);box-shadow:var(--shadow-md);display:none}
.kg-info.show{display:block}
.kg-info .ki-title{font-family:var(--font-serif);font-size:16px;font-weight:600;margin-bottom:4px}
.kg-info .ki-type{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kg-info .ki-links{display:flex;gap:3px;flex-wrap:wrap}
.kg-info .ki-links span{padding:1px 8px;border-radius:8px;font-size:10px;background:var(--cream);color:var(--t2);cursor:pointer}
.kg-info .ki-links span:hover{background:var(--sage-light);color:var(--sage-dark)}

/* ── Content Header ── */
.page-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-h h2{font-family:var(--font-serif);font-size:24px;font-weight:700;letter-spacing:-.3px}
.page-h .sub{font-size:13px;color:var(--t2);margin-top:2px}
.page-h .count{font-size:12px;color:var(--t3);background:var(--cream);padding:2px 10px;border-radius:12px;font-weight:500}

/* ── Filter Bar ── */
.fb{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.fb button{padding:4px 14px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--t2);cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.fb button:hover{border-color:var(--sage);color:var(--text)}
.fb button.active{background:var(--sage-dark);color:#fff;border-color:var(--sage-dark)}

/* ── Modal ── */
.mo{display:none;position:fixed;inset:0;background:rgba(44,44,44,.25);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.mo.show{display:flex}
.mm{background:var(--surface);border-radius:var(--radius-lg);width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:24px 28px;box-shadow:var(--shadow-lg);animation:modalIn .2s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.mm h2{font-family:var(--font-serif);font-size:18px;font-weight:700;margin-bottom:2px}
.mm .ms{font-size:12px;color:var(--t2);margin-bottom:14px}
.mm .cl{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--t2);line-height:1}
.f2{display:flex;gap:8px;margin-bottom:8px}
.f2 .fd{flex:1}
.f2 .fd label{font-size:11px;color:var(--t2);margin-bottom:2px;display:block;font-weight:500}
.f2 .fd input,.f2 .fd select,.f2 .fd textarea{width:100%;padding:8px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);transition:all .15s;color:var(--text)}
.f2 .fd input:focus,.f2 .fd select:focus,.f2 .fd textarea:focus{outline:none;border-color:var(--sage-dark);box-shadow:0 0 0 3px var(--sage-light);background:var(--surface)}
.f2 .fd textarea{resize:vertical;min-height:40px}
.mm .sb{width:100%;padding:9px;background:var(--sage-dark);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;margin-top:4px;transition:all .15s}
.mm .sb:hover{opacity:.9}

/* ── Slide Panel ── */
.sp-overlay{display:none;position:fixed;inset:0;background:rgba(44,44,44,.12);z-index:100}
.sp-overlay.show{display:block}
.sp{position:fixed;top:0;right:-540px;width:540px;max-width:92vw;height:100vh;background:var(--surface);z-index:101;overflow-y:auto;transition:right .25s ease;box-shadow:-4px 0 32px rgba(44,44,44,.08);border-left:1px solid var(--border)}
.sp.show{right:0}
.sp .sp-h{padding:16px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
.sp .sp-h h3{font-family:var(--font-serif);font-size:17px;font-weight:600}
.sp .sp-h .cl{background:none;border:none;font-size:22px;cursor:pointer;color:var(--t2);padding:4px}
.sp .sp-b{padding:16px 24px 40px}
.sp .sp-b .fl{margin-bottom:14px}
.sp .sp-b .fl label{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px}
.sp .sp-b .fl .v{font-size:13px;line-height:1.6;color:var(--text)}
.sp .sp-b .fl input,.sp .sp-b .fl textarea,.sp .sp-b .fl select{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:var(--bg);color:var(--text)}
.sp .sp-b .fl textarea{resize:vertical;min-height:60px}
.sp .sp-b .sv{width:100%;padding:8px;background:var(--sage-dark);color:#fff;border:none;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;cursor:pointer;font-weight:500}

/* ── Responsive ── */
@media(max-width:640px){.home-grid{grid-template-columns:1fr}.reading-grid{grid-template-columns:1fr}.skills-grid{grid-template-columns:1fr}.p-hero{padding:20px}}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="topNav">
    <div class="logo"><span>⛰️</span>知屿</div>
    <a class="active" data-page="home">🏠 Home</a>
    <a data-page="journal">📖 Journal</a>
    <a data-page="reading">📚 Reading</a>
    <a data-page="projects">🏗️ Projects</a>
    <a data-page="skills">🌱 Skills</a>
    <a data-page="graph">🕸️ Graph</a>
    <div class="spacer"></div>
    <button class="add-btn" onclick="showAdd()">＋ 新建</button>
  </nav>
  <div class="main" id="mainContent"></div>
</div>

<!-- Slide Panel -->
<div class="sp-overlay" id="spOverlay" onclick="closePanel()"></div>
<div class="sp" id="slidePanel"><div class="sp-h"><h3 id="spTitle">详情</h3><button class="cl" onclick="closePanel()">✕</button></div><div class="sp-b" id="spBody"></div></div>

<!-- Modal -->
<div class="mo" id="addModal" onclick="if(event.target===this)closeAdd()">
  <div class="mm" onclick="event.stopPropagation()">
    <button class="cl" onclick="closeAdd()">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
// ═══ DATA ═══════════════════════════════════════════
const TYPES={book:'📚',movie:'🎬',podcast:'🎙️',paper:'📄',video:'🎥'}
const SL={read:'已读',reading:'在读',want:'想读',done:'完成',watching:'在看',listening:'在听',learning:'学习中',practicing:'练习中',mastered:'已掌握',ongoing:'进行中',paused:'暂停',active:'活跃',archived:'归档'}
const LV={beginner:'初级',intermediate:'中级',advanced:'高级',expert:'专家'}

let DATA=[
  {id:'d1',type:'journal',title:'开始搭建知识体系',date:'2026-07-25',body:'今天重新设计了知识管理系统「知屿」。以 Home、Journal、Reading、Projects、Skills、Graph 六个模块构建。每个模块都有自己的视角，而 Knowledge Graph 将它们全部连接。',tags:['知识管理'],links:['p1','r1']},
  {id:'d2',type:'journal',title:'文化地理学初探',date:'2026-07-22',body:'读了迈克·克朗的《文化地理学》，对"空间"与"地方"的区分有了更深理解。空间是被抽象化的区域，而地方是充满意义和情感的空间。这个区分对理解文学中的地理意象很有帮助。',tags:['文学地理学'],links:['p1','r1']},
  {id:'d3',type:'journal',title:'观鸟记录：中山公园',date:'2026-07-20',body:'今天在中山公园观鸟，看到了一只大斑啄木鸟和一群银喉长尾山雀。啄木鸟敲击树干的声音很远就能听到。银喉山雀非常活泼，在树枝间跳来跳去。',tags:['观鸟'],links:['p2']},

  {id:'p1',type:'project',title:'文化地理学',icon:'🌍',desc:'研究文化现象在空间中的分布、传播及其与地理环境的关系。',tags:['文学','地理','空间'],created:'2026-07-20',
    tree:[{n:'核心概念',c:[{n:'空间与地方',c:[{n:'空间 vs 地方'},{n:'场所感'},{n:'无地方性'}]},{n:'景观',c:[{n:'文化景观'},{n:'景观解读'}]},{n:'文化转向'}]},{n:'重要学者',c:[{n:'卡尔·索尔'},{n:'段义孚'},{n:'爱德华·索亚'},{n:'迈克·克朗'}]},{n:'相关阅读',c:[{n:'文化地理学 (书)'},{n:'空间的生产 (书)'},{n:'地方与空间 (论文)'}]}],
    readings:['r1','r2']},
  {id:'p2',type:'project',title:'观鸟',icon:'🐦',desc:'系统观察和记录野生鸟类，学习鸟类识别、行为生态和保护。',tags:['鸟类','生态','自然'],created:'2026-07-18',
    tree:[{n:'鸟类分类',c:[{n:'雀形目'},{n:'鴷形目'},{n:'隼形目'},{n:'雁形目'}]},{n:'观察技巧',c:[{n:'听声辨鸟'},{n:'望远镜使用'},{n:'记录方法'}]},{n:'本地鸟种',c:[{n:'常见林鸟'},{n:'水鸟'},{n:'猛禽'}]}],
    readings:['r3']},

        ${n.c?.length?`<span class="toggle">▶</span>`:`<span class="toggle" style="visibility:hidden">▶</span>`}
        <span class="t-icon">${n.c?.length?'📂':'📄'}</span>
        <span class="t-title">${es(n.n||'')}</span>
        ${n.c?.length?`<span class="t-count">${n.c.length}</span>`:''}
      </div>
      ${n.c?.length?`<div class="children">${buildTree(n.c,depth+1)}</div>`:''}

function renderGraph(mc){
  const nodes=DATA.filter(d=>d.type!=='skill'&&d.type!=='journal').slice(0,12)
  const cx=400,cy=250,r=180
  mc.innerHTML=`<div class="page-h"><h2>🕸️ Knowledge Graph</h2></div>
  <div class="kg-container" id="kgContainer">
    <svg viewBox="0 0 800 500" id="kgSvg"></svg>
    <div class="kg-info" id="kgInfo"></div>
  </div>`
  setTimeout(()=>drawGraph(nodes,cx,cy,r),50)
}

function drawGraph(nodes,cx,cy,r){
  const svg=document.getElementById('kgSvg')
  const colors={project:'var(--sage-dark)',reading:'#8ab4d8',journal:'var(--star)'}
  const angles=nodes.map((_,i)=>2*Math.PI*i/nodes.length-Math.PI/2)
  const positions=angles.map(a=>({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}))
  let links='',circles='',labels=''

  for(let i=0;i<nodes.length;i++){
    for(let j=i+1;j<nodes.length;j++){
      const connected=nodes[i].projects?.includes(nodes[j].id)||nodes[j].projects?.includes(nodes[i].id)||
        nodes[i].links?.includes(nodes[j].id)||nodes[j].links?.includes(nodes[i].id)||
        nodes[i].readings?.includes(nodes[j].id)||false
      if(connected){
        links+=`<line x1="${positions[i].x}" y1="${positions[i].y}" x2="${positions[j].x}" y2="${positions[j].y}" stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4,3"/>`
      }
    }
    const col=nodes[i].type==='project'?colors.project:nodes[i].type==='reading'?colors.reading:colors.journal
    circles+=`<g class="kg-node" onclick="showNodeInfo('${nodes[i].id}')">
      <circle cx="${positions[i].x}" cy="${positions[i].y}" r="${nodes[i].type==='project'?12:8}" class="kg-circle" fill="${col}" stroke="#fff" stroke-width="2" opacity=".85"/>
    </g>`
    labels+=`<text x="${positions[i].x}" y="${positions[i].y+22}" text-anchor="middle" class="kg-label" font-size="11" fill="var(--t2)" font-weight="500">${es(nodes[i].title||'').slice(0,12)}</text>`
  }
  svg.innerHTML=links+circles+labels
}

function showNodeInfo(id){
  const d=DATA.find(x=>x.id===id);if(!d)return
  const el=document.getElementById('kgInfo')
  const rels=[]
  if(d.projects?.length)rels.push(...d.projects.map(pid=>{const p=DATA.find(x=>x.id===pid);return p?`🏗️ ${es(p.title)}`:''}).filter(Boolean))
  if(d.links?.length)rels.push(...d.links.map(lid=>{const l=DATA.find(x=>x.id===lid);return l?`📖 ${es(l.title)}`:''}).filter(Boolean))
  if(d.readings?.length)rels.push(...d.readings.map(rid=>{const r=DATA.find(x=>x.id===rid);return r?`📚 ${es(r.title)}`:''}).filter(Boolean))
  el.innerHTML=`<div class="ki-title">${es(d.title)}</div><div class="ki-type">${d.type}</div>${d.desc?`<div style="font-size:12px;color:var(--t2);margin-bottom:6px;line-height:1.5">${es(d.desc)}</div>`:''}${rels.length?`<div class="ki-links">${rels.map(r=>`<span onclick="openPanel('${id}')">${r}</span>`).join('')}</div>`:''}`
  el.classList.add('show')
}

function openPanel(id){
  PANEL_ID=id;const d=DATA.find(x=>x.id===id);if(!d)return
  document.getElementById('spOverlay').classList.add('show')
  document.getElementById('slidePanel').classList.add('show')
  document.getElementById('spTitle').textContent=d.title||'详情'
  const info=LB(d.type)
  let h=[`<div class="fl"><label>类型</label><div class="v">${info.icon||''} ${info.label||d.type}</div></div>`
  ,`<div class="fl"><label>标题</label><input value="${es(d.title||'')}" id="pT"></div>`]
  if(d.creator!==undefined)h.push(`<div class="fl"><label>${d.type==='reading'?'作者':d.type==='skill'?'来源':'创作者'}</label><input value="${es(d.creator||'')}" id="pC"></div>`)
  if(d.body!==undefined)h.push(`<div class="fl"><label>内容</label><textarea id="pB" rows="4">${es(d.body||'')}</textarea></div>`)
  if(d.notes!==undefined)h.push(`<div class="fl"><label>笔记</label><textarea id="pN" rows="4">${es(d.notes||'')}</textarea></div>`)
  if(d.tags!==undefined)h.push(`<div class="fl"><label>标签</label><input value="${(d.tags||[]).join(', ')}" id="pTags"></div>`)
  h.push(`<button class="sv" onclick="savePanel()">💾 保存</button>`)
  document.getElementById('spBody').innerHTML=h.join('')
}
function closePanel(){document.getElementById('spOverlay').classList.remove('show');document.getElementById('slidePanel').classList.remove('show')}
function savePanel(){
  const d=DATA.find(x=>x.id===PANEL_ID);if(!d)return
  const t=document.getElementById('pT');if(t)d.title=t.value.trim()
  const c=document.getElementById('pC');if(c)d.creator=c.value.trim()
  const b=document.getElementById('pB');if(b){if(d.type==='journal')d.body=b.value.trim();else d.notes=b.value.trim()}
  const n=document.getElementById('pN');if(n)d.notes=n.value.trim()
  const tg=document.getElementById('pTags');if(tg)d.tags=tg.value.split(/[,，、、]/).map(t=>t.trim()).filter(Boolean)
  save();closePanel();render()
}
function LB(t){return{journal:{icon:'📖',label:'日记'},reading:{icon:'📚',label:'阅读'},project:{icon:'🏗️',label:'课题'},skill:{icon:'🌱',label:'技能'}}[t]||{icon:'📌',label:t}}

    <div id="addForm"></div>
    <button class="sb" onclick="confirmAdd()">✅ 创建</button>`
  buildAddForm()
}
function closeAdd(){document.getElementById('addModal').classList.remove('show');document.body.style.overflow=''}
function buildAddForm(){
  const tp=document.getElementById('aType').value
  if(tp==='journal'){document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>标题</label><input id="aT"></div></div><div class="f2"><div class="fd"><label>内容</label><textarea id="aB" rows="4"></textarea></div></div>`;return}
  const subs={reading:{book:'📚 书籍',movie:'🎬 影视',podcast:'🎙️ 播客',paper:'📄 论文',video:'🎥 视频'},project:{},skill:{}}
  const pjs=DATA.filter(d=>d.type==='project')
  if(tp==='reading'){
    document.getElementById('addForm').innerHTML=`
      <div class="f2"><div class="fd"><label>子类型</label><select id="aST">${Object.entries(subs.reading).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="fd"><label>标题</label><input id="aT"></div></div>
      <div class="f2"><div class="fd"><label>作者/导演</label><input id="aC"></div><div class="fd"><label>分类</label><input id="aSu"></div></div>
      ${pjs.length?`<div class="f2"><div class="fd"><label>关联课题</label><select id="aP"><option value="">不关联</option>${pjs.map(p=>`<option value="${p.id}">${p.icon||'📚'} ${p.title}</option>`).join('')}</select></div></div>`:''}
      <div class="f2"><div class="fd"><label>笔记</label><textarea id="aN" rows="3"></textarea></div></div>`
  }else if(tp==='project'){
    document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>名称</label><input id="aT"></div><div class="fd"><label>图标</label><select id="aI"><option value="🌍">🌍 地球</option><option value="🐦">🐦 鸟类</option><option value="🧠">🧠 大脑</option><option value="📚">📚 书籍</option><option value="🔬">🔬 科学</option></select></div></div><div class="f2"><div class="fd"><label>描述</label><textarea id="aD" rows="3"></textarea></div></div>`
  }else if(tp==='skill'){
    document.getElementById('addForm').innerHTML=`<div class="f2"><div class="fd"><label>技能名称</label><input id="aT"></div><div class="fd"><label>等级</label><select id="aL"><option value="beginner">初级</option><option value="intermediate">中级</option><option value="advanced">高级</option></select></div></div><div class="f2"><div class="fd"><label>分类</label><input id="aSu"></div><div class="fd"><label>标签</label><input id="aTg" placeholder="逗号分隔"></div></div>`
  }
}
function confirmAdd(){
  const tp=document.getElementById('aType').value;const t=document.getElementById('aT')?.value.trim()
  if(!t)return;const projects=document.getElementById('aP')?.value||''
  let item={id:'d'+Date.now(),type:tp,title:t,date:new Date().toISOString().slice(0,10),tags:[]}
  if(tp==='journal'){item.body=document.getElementById('aB')?.value.trim()||''}
  else if(tp==='reading'){item.subtype=document.getElementById('aST')?.value||'book';item.creator=document.getElementById('aC')?.value.trim()||'';item.notes=document.getElementById('aN')?.value.trim()||'';item.highlights=[];item.projects=projects?[projects]:[]}
  else if(tp==='project'){item.icon=document.getElementById('aI')?.value||'📚';item.desc=document.getElementById('aD')?.value.trim()||'';item.tree=[];item.readings=[]}
  else if(tp==='skill'){item.level=document.getElementById('aL')?.value||'beginner';item.progress=0;item.status='learning';item.practices=[];item.resources=[];item.tags=document.getElementById('aTg')?.value.split(/[,，、]/).map(t=>t.trim()).filter(Boolean)||[]}
  DATA.push(item);save();closeAdd();render()
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('slidePanel').classList.contains('show'))closePanel();else if(document.getElementById('addModal').classList.contains('show'))closeAdd()}})
load();navigate('home')
</script>
</body>
</html>
