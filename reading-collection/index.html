<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识体系</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#f8f9fa;--card:#fff;--surface:#fff;--text:#1a1a2e;--t2:#6c757d;--t3:#adb5bd;--accent:#4361ee;--accent2:#7209b7;--al:#eef1ff;--border:#dee2e6;--radius:12px;--shadow:0 1px 3px rgba(0,0,0,.04);--star:#f59e0b;--green:#06d6a0;--blue:#4361ee;--orange:#fb8500}
body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;height:100vh;overflow:hidden}

/* ── Top Navigation ── */
.top{background:var(--surface);border-bottom:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.top-main{display:flex;align-items:center;padding:8px 20px;gap:4px;flex-wrap:wrap}
.top-main .logo{font-size:15px;font-weight:700;margin-right:12px;display:flex;align-items:center;gap:6px;letter-spacing:-.3px}
.top-main .logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-nav{display:flex;gap:2px;flex-wrap:wrap}
.top-nav button{padding:6px 16px;border:none;background:transparent;cursor:pointer;border-radius:8px;font-size:13px;font-family:inherit;color:var(--t2);transition:all .15s;display:flex;align-items:center;gap:5px}
.top-nav button:hover{background:var(--al);color:var(--accent)}
.top-nav button.active{background:var(--accent);color:#fff;font-weight:500;box-shadow:0 2px 8px rgba(67,97,238,.25)}
.top-actions{margin-left:auto;display:flex;gap:4px}
.top-actions button{padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.top-actions .btn-ai{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:500}
.top-actions .btn-add{background:var(--al);color:var(--accent)}

/* ── Sub Navigation ── */
.sub{display:flex;align-items:center;padding:4px 20px 6px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--border)}
.sub .label{font-size:11px;font-weight:600;color:var(--t2);margin-right:8px;letter-spacing:.3px}
.sub .filter{display:flex;gap:2px;flex-wrap:wrap}
.sub .filter button{padding:2px 10px;border-radius:12px;border:none;background:transparent;color:var(--t2);cursor:pointer;font-size:11px;font-family:inherit;transition:all .15s}
.sub .filter button:hover{background:var(--al);color:var(--accent)}
.sub .filter button.active{background:var(--accent);color:#fff}

/* ── Main Content ── */
.content{flex:1;overflow-y:auto;padding:16px 20px 80px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── Card ── */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;cursor:pointer;transition:all .2s;width:calc(33.333% - 6px);min-width:260px;flex:1 1 260px}
.card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(67,97,238,.08);transform:translateY(-2px)}
.card .tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--t3);background:var(--bg);padding:2px 8px;border-radius:10px;margin-bottom:4px}
.card .tag .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.card .tag .dot.in{background:var(--blue)}.card .tag .dot.out{background:var(--orange)}.card .tag .dot.sk{background:var(--green)}.card .tag .dot.sb{background:var(--accent2)}
.card h3{font-size:14px;font-weight:600;margin-bottom:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:11px;color:var(--t2);margin-bottom:2px}
.card .excerpt{font-size:12px;color:var(--t2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;padding-top:4px;border-top:1px solid var(--bg)}
.card .links{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.card .links span{font-size:9px;padding:1px 7px;border-radius:8px;background:var(--al);color:var(--accent)}
.stars{display:inline-flex;gap:1px;font-size:11px}
.stars .f{color:var(--star)}.stars .e{color:#e5e5ea}

/* ── Journal Timeline ── */
.timeline{position:relative;padding-left:24px;width:100%}
.timeline::before{content:'';position:absolute;left:8px;top:4px;bottom:4px;width:1.5px;background:var(--border)}
.tl-item{position:relative;margin-bottom:10px;width:100%}
.tl-item::before{content:'';position:absolute;left:-18px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 3px rgba(67,97,238,.15)}
.tl-item .date{font-size:10px;color:var(--t3);margin-bottom:2px}
.tl-item .card{width:100%;flex:none}

/* ── Skills Board ── */
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;width:100%}
.sk-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:14px;cursor:pointer;transition:all .2s}
.sk-card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(67,97,238,.08)}
.sk-card .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sk-card .hd .name{font-size:14px;font-weight:600}
.sk-card .hd .lvl{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--al);color:var(--accent)}
.sk-card .bar{height:4px;border-radius:2px;background:var(--bg);overflow:hidden;margin-top:6px}
.sk-card .bar .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--green))}
.sk-card .stat{display:flex;gap:8px;margin-top:4px;font-size:10px;color:var(--t2)}

/* ── Subject View ── */
.sub-hero{width:100%;background:linear-gradient(135deg,var(--al),rgba(114,9,183,.05));border-radius:var(--radius);padding:20px;margin-bottom:12px;display:flex;gap:16px;align-items:flex-start;border:1px solid var(--border)}
.sub-hero .icon{font-size:32px;flex-shrink:0}
.sub-hero .title{font-size:18px;font-weight:700;margin-bottom:2px}
.sub-hero .desc{font-size:12px;color:var(--t2);line-height:1.5}
.sub-group{margin-bottom:16px;width:100%}
.sub-group .g-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-left:2px}
.sub-group .g-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}

/* ── Detail Panel (slide-in) ── */
.detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:100}
.detail-overlay.show{display:block}
.detail-panel{position:fixed;top:0;right:-480px;width:480px;max-width:90vw;height:100vh;background:var(--surface);z-index:101;overflow-y:auto;transition:right .25s ease;box-shadow:-4px 0 24px rgba(0,0,0,.08);border-left:1px solid var(--border)}
.detail-panel.show{right:0}
.detail-panel .dp-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
.detail-panel .dp-h h2{font-size:16px;font-weight:600}
.detail-panel .dp-h .close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--t2);padding:4px}
.detail-panel .dp-b{padding:16px 20px 40px}
.detail-panel .dp-b .field{margin-bottom:12px}
.detail-panel .dp-b .field label{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px}
.detail-panel .dp-b .field .val{font-size:13px;color:var(--text);line-height:1.5}
.detail-panel .dp-b .field input,.detail-panel .dp-b .field textarea,.detail-panel .dp-b .field select{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;background:var(--bg)}
.detail-panel .dp-b .field textarea{resize:vertical;min-height:60px}
.detail-panel .dp-b .save-btn{width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:500;margin-top:4px}

/* ── Empty ── */
.empty{text-align:center;padding:60px 20px;color:var(--t2);width:100%}
.empty .ei{font-size:32px;margin-bottom:6px;opacity:.4}

/* ── Add Modal ── */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.mo.show{display:flex}
.mo-inner{background:var(--surface);border-radius:14px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.mo-inner h2{font-size:15px;font-weight:600;margin-bottom:2px}
.mo-inner .ms{font-size:11px;color:var(--t2);margin-bottom:12px}
.mo-inner .close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--t2);line-height:1}
.f2{display:flex;gap:8px;margin-bottom:6px}
.f2 .fd{flex:1}
.f2 .fd label{font-size:10px;color:var(--t2);margin-bottom:2px;display:block;font-weight:500}
.f2 .fd input,.f2 .fd select,.f2 .fd textarea{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;background:var(--bg);transition:all .15s}
.f2 .fd input:focus,.f2 .fd select:focus,.f2 .fd textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(67,97,238,.08)}
.f2 .fd textarea{resize:vertical;min-height:30px}
.mo-inner .sb2{width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:500;margin-top:4px}

@media(max-width:768px){
  .card{flex:1 1 100%;min-width:0}
  .detail-panel{width:100vw;max-width:100vw}
  .top-main{padding:8px 12px}
  .top-main .logo{font-size:13px}
  .top-nav button{padding:4px 10px;font-size:12px}
  .sub{padding:4px 12px 6px}
  .content{padding:10px 12px 70px}
}

/* ── Responsive Card ── */
@media(max-width:480px){
  .sk-grid{grid-template-columns:1fr}
  .sub-group .g-cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" style="display:flex;flex-direction:column;height:100vh">
  <!-- Top Navigation -->
  <div class="top">
    <div class="top-main">
      <div class="logo"><span>🧠 知识体系</span></div>
      <div class="top-nav" id="mainNav">
        <button class="active" data-v="journal">📔 日记</button>
        <button data-v="book">📥 输入</button>
        <button data-v="skill">🎯 技能</button>
        <button data-v="subject-landing">📚 课题</button>
      </div>
      <div class="top-actions">
        <button class="btn-ai" onclick="showAdd('ai')">🤖 AI</button>
        <button class="btn-add" onclick="showAdd('manual')">＋ 添加</button>
      </div>
    </div>
    <div class="sub" id="subBar">
      <div class="label" id="viewLabel">📔 日记</div>
      <div class="filter" id="filterRow"></div>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="content"></div>
</div>

<!-- Detail Panel -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="dp-h"><h2 id="detailTitle">详情</h2><button class="close" onclick="closeDetail()">✕</button></div>
  <div class="dp-b" id="detailBody"></div>
</div>

<!-- Add Modal -->
<div class="mo" id="addModal" onclick="closeAdd(event)">
  <div class="mo-inner" onclick="event.stopPropagation()">
    <button class="close" onclick="closeAdd()">✕</button>
    <div id="addBody"></div>
  </div>
</div>

<script>
const IC={journal:'📔',book:'📚',movie:'🎬',article:'📝',podcast:'🎙️',english:'🇬🇧',skill:'🎯',subject:'📚',review:'🔄',sop:'📋',idea:'💡',tool:'🔧'}
const LB={journal:'日记',book:'书籍',movie:'影视',article:'文章',podcast:'播客',english:'英语',skill:'技能',subject:'课题',review:'复盘',sop:'SOP',idea:'灵感',tool:'工具'}
const ST={read:'已读',reading:'在读',want:'想读',done:'完成',watching:'在看',saved:'已存',listening:'在听',learning:'学习中',practicing:'练习中',mastered:'已掌握',todo:'待学',active:'启用',archived:'归档',ongoing:'进行中',paused:'暂停',using:'在用',tried:'试过'}
const FL={in:['book','movie','article','podcast','english'],out:['project','review','sop','idea'],tool:['tool']}
const LV={beginner:'初级',intermediate:'中级',advanced:'高级',expert:'专家'}
const D=[{t:'journal',ti:'开始搭建知识体系',da:'2026-07-25',bo:'今天开始搭建个人知识体系。',sb:['知识体系构建']},{t:'journal',ti:'读文学地理学笔记',da:'2026-07-23',bo:'文学地理学涉及空间、地方与文学的关系。',sb:['文学地理学']},
{t:'subject',ti:'文学地理学',ic:'🌍',de:'研究文学与地理空间关系的学科。',ta:['文学','地理']},{t:'subject',ti:'鸟类知识体系',ic:'🐦',de:'系统整理鸟类学知识。',ta:['动物','自然']},{t:'subject',ti:'知识体系构建',ic:'🧠',de:'个人知识管理方法论。',ta:['PKM']},
{t:'book',ti:'文学地理学',cr:'迈克·克朗',st:'reading',su:'人文社科',da:'2026-07',tg:['文学'],ex:'研究文学中的空间与地方。',sb:['文学地理学']},{t:'book',ti:'百年孤独',cr:'马尔克斯',st:'read',rt:5,su:'文学小说',da:'2026-07',tg:['魔幻现实'],ex:'马孔多小镇的百年兴衰。',sb:['文学地理学']},{t:'book',ti:'活着',cr:'余华',st:'read',rt:5,su:'文学小说',da:'2025-12',tg:['中国文学'],ex:'人是为了活着本身而活着。'},
{t:'movie',ti:'肖申克的救赎',cr:'德拉邦特',st:'done',rt:5,su:'剧情',da:'2026-06',tg:['经典'],ex:'恐惧让你沦为囚犯。'},{t:'movie',ti:'霸王别姬',cr:'陈凯歌',st:'done',rt:5,su:'剧情',da:'2025-09',tg:['华语经典'],ex:'不疯魔不成活。',sb:['文学地理学']},
{t:'english',ti:'Serendipity',cr:'词汇',st:'learning',lv:'beginner',pr:30,su:'词汇',tg:['词汇'],ex:'意外发现美好事物的能力。'},{t:'skill',ti:'Live2D 建模',cr:'自学',st:'learning',lv:'beginner',pr:25,su:'数字绘画',tg:['Live2D'],ex:'角色建模与动画。'},{t:'skill',ti:'UI/UX 设计',cr:'自学',st:'practicing',lv:'intermediate',pr:55,su:'设计',tg:['Figma'],ex:'界面设计与用户研究。'},
{t:'review',ti:'7月第三周复盘',cr:'自己',st:'done',rt:4,su:'weekly',da:'2026-07-21',tg:['复盘'],ex:'整体状态不错。',sb:['知识体系构建']},{t:'sop',ti:'周复盘流程',cr:'自我管理',st:'active',su:'效率',tg:['复盘'],ex:'每周日的复盘标准流程。',sb:['知识体系构建']},{t:'tool',ti:'Obsidian',cr:'Obsidian MD',st:'using',su:'笔记',rt:5,tg:['PKM'],ex:'个人知识管理神器。',sb:['知识体系构建']}]
const DF=D.map(d=>d.ti||d.bo?.slice(0,20));const SK='kv6';let I=[],VIEW='journal',SUB='journal',FIL='all',DETAIL=null

function sv(){const c=I.filter(i=>!DF.includes(i.ti||i.bo?.slice(0,20)));try{localStorage.setItem(SK,JSON.stringify(c))}catch(e){}}
function ld(){I=JSON.parse(JSON.stringify(D));try{const s=localStorage.getItem(SK);if(s){let e=JSON.parse(s);if(Array.isArray(e))I.push(...e)}}catch(e){}sv()}
function id(x){return I.indexOf(x)}
function es(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sr(r){if(!r)return '';return Array.from({length:5},(_,i)=>`<span class="${i<r?'f':'e'}">★</span>`).join('')}
function gs(){return I.filter(i=>i.t==='subject')}
function dot(t){if(t==='journal')return'dot in';const fl=Object.entries(FL);for(let[k,v]of fl)if(v.includes(t))return`dot ${k}`;return'dot sb'}

function navigate(view,sub){
  VIEW=view;SUB=sub||'all';FIL='all'
  document.querySelectorAll('#mainNav button').forEach(b=>b.classList.remove('active'))
  const btn=document.querySelector(`#mainNav button[data-v="${view}"]`)
  if(btn)btn.classList.add('active')
  render()
}

function render(){
  const ct=document.getElementById('content');const vl=document.getElementById('viewLabel')
  const subs=getSubjects()
  // Build sub nav based on view
  let sbHtml=''
  if(VIEW==='journal'){vl.innerHTML='📔 日记';sbHtml='<button class="active" data-s="journal">📝 时间线</button><button data-s="week">📅 周记</button>'}
  else if(VIEW==='book'||VIEW==='movie'||VIEW==='article'||VIEW==='podcast'||VIEW==='english'||VIEW==='skill'){vl.innerHTML=`${IC[VIEW]||''} ${LB[VIEW]||VIEW}`}
  else if(VIEW==='subject-landing'){vl.innerHTML='📚 课题';sbHtml=subs.map(s=>`<button data-s="sub:${es(s.ti)}">${s.ic||'📚'} ${es(s.ti)}</button>`).join('')}
  else if(VIEW.startsWith('sub:')){const sn=VIEW.slice(4);const s=subs.find(x=>x.ti===sn);vl.innerHTML=`${s?.ic||'📚'} ${sn||''}`}
  document.getElementById('filterRow').innerHTML=sbHtml
  document.querySelectorAll('#filterRow button').forEach(b=>{b.onclick=()=>{document.querySelectorAll('#filterRow button').forEach(bb=>bb.classList.remove('active'));b.classList.add('active');SUB=b.dataset.s;navigate(VIEW,SUB)}})

  // Render content
  if(VIEW==='journal'&&SUB==='journal')renderJournal(ct)
  else if(VIEW==='journal'&&SUB==='week')renderWeek(ct)
  else if(VIEW==='skill')renderSkills(ct)
  else if(VIEW==='english')renderSkills(ct)
  else if(VIEW.startsWith('sub:'))renderSubject(ct,VIEW.slice(4))
  else if(VIEW==='subject-landing')renderSubjectLanding(ct)
  else renderItems(ct)
}

function renderJournal(ct){
  const entries=I.filter(i=>i.t==='journal').sort((a,b)=>b.da.localeCompare(a.da))
  if(!entries.length){ct.innerHTML=`<div class="empty"><div class="ei">📝</div><p>暂无日记</p></div>`;return}
  ct.innerHTML=`<div class="timeline">${entries.map(x=>`<div class="tl-item"><div class="date">${x.da||''}</div><div class="card" onclick="openDetail(${id(x)})"><h3>${es(x.ti||'')}</h3><div style="font-size:12px;color:var(--t2);margin-top:2px;line-height:1.5">${es(x.bo||'')}</div>${x.sb?.length?`<div class="links">${x.sb.map(s=>`<span>📚${es(s)}</span>`).join('')}</div>`:''}</div></div>`).join('')}</div>`
}
function renderWeek(ct){
  const entries=I.filter(i=>i.t==='review'&&i.su==='weekly').sort((a,b)=>b.da.localeCompare(a.da))
  if(!entries.length){ct.innerHTML=`<div class="empty"><div class="ei">📅</div><p>暂无周记</p></div>`;return}
  ct.innerHTML=`<div style="display:flex;flex-direction:column;gap:6px;width:100%">${entries.map(x=>`<div class="card" style="width:100%;flex:none" onclick="openDetail(${id(x)})"><div style="font-size:10px;color:var(--t3);margin-bottom:2px">${x.da||''}</div><h3>${es(x.ti||'')}</h3><div style="font-size:12px;color:var(--t2);margin-top:2px">${es(x.ex||'')}</div></div>`).join('')}</div>`
}
function renderSkills(ct){
  const list=I.filter(i=>i.t===VIEW).sort((a,b)=>(b.pr||0)-(a.pr||0))
  if(!list.length){ct.innerHTML=`<div class="empty"><div class="ei">🎯</div><p>暂无</p></div>`;return}
  ct.innerHTML=`<div class="sk-grid">${list.map(x=>{const p=Math.min(x.pr||0,100);return`<div class="sk-card" onclick="openDetail(${id(x)})"><div class="hd"><span class="name">${VIEW==='english'?'🇬🇧':'🎯'} ${es(x.ti||'')}</span><span class="lvl">${LV[x.lv]||x.lv||''}</span></div><div style="font-size:10px;color:var(--t2)">${es(x.cr||'')} · ${es(x.su||'')}</div><div class="bar"><div class="fill" style="width:${p}%"></div></div><div class="stat"><span>${p}%</span><span>${ST[x.st]||x.st}</span></div></div>`}).join('')}</div>`
}
function renderSubjectLanding(ct){
  const subs=gs()
  if(!subs.length){ct.innerHTML=`<div class="empty"><div class="ei">📚</div><p>暂无课题，点击右下角创建</p></div>`;return}
  ct.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;width:100%">${subs.map(x=>{const cnt=I.filter(i=>i.sb?.includes(x.ti)).length;return`<div class="card" onclick="navigate('sub:${es(x.ti)}')"><div style="font-size:24px;margin-bottom:4px">${x.ic||'📚'}</div><h3>${es(x.ti)}</h3><div class="meta" style="margin-top:2px">${cnt} 条关联 · ${x.ta?.map(t=>`#${t}`).join(' ')||''}</div><div class="excerpt">${es(x.de||'')}</div></div>`}).join('')}</div>`
}
function renderSubject(ct,sn){
  const sub=I.find(i=>i.t==='subject'&&i.ti===sn);const rl=I.filter(i=>i.sb?.includes(sn))
  let h=''
  if(sub)h+=`<div class="sub-hero"><div class="icon">${sub.ic||'📚'}</div><div><div class="title">${es(sub.ti)}</div><div class="desc">${es(sub.de||'')}</div></div></div>`
  const gr={};rl.forEach(i=>{const t=i.t;if(!gr[t])gr[t]=[];gr[t].push(i)})
  const or=['book','movie','article','podcast','english','skill','review','sop','idea','tool','journal']
  if(!rl.length){h+=`<div class="empty" style="width:100%"><div class="ei">📭</div><p>暂无关联内容</p></div>`;ct.innerHTML=h;return}
  or.filter(t=>gr[t]).forEach(t=>{h+=`<div class="sub-group"><div class="g-title">${IC[t]||''} ${LB[t]||t}</div><div class="g-cards">${gr[t].map(x=>`<div class="card" onclick="openDetail(${id(x)})"><h3>${es(x.ti||'')}</h3><div class="meta">${es(x.cr||'')}${x.da?` · ${x.da}`:''}</div><div class="excerpt">${es(x.ex||'')}</div></div>`).join('')}</div></div>`})
  ct.innerHTML=h
}
function renderItems(ct){
  let list=I.filter(i=>i.t===VIEW).sort((a,b)=>(b.da||'').localeCompare(a.da||''))
  if(FIL!=='all')list=list.filter(i=>i.st===FIL||i.su===FIL||(i.tg&&i.tg.includes(FIL)))
  if(!list.length){ct.innerHTML=`<div class="empty"><div class="ei">📭</div><p>暂无内容</p></div>`;return}
  ct.innerHTML=list.map(x=>`<div class="card" onclick="openDetail(${id(x)})"><div class="tag"><span class="dot ${dot(x.t)}"></span>${IC[x.t]||''} ${LB[x.t]||x.t}</div><h3>${es(x.ti||'')}</h3><div class="meta">${es(x.cr||'')}${x.da?` · ${x.da}`:''}${x.rt?` · <span class="stars">${sr(x.rt)}</span>`:''}</div><div class="excerpt">${es(x.ex||'')}</div>${x.sb?.length?`<div class="links">${x.sb.map(s=>`<span>📚${es(s)}</span>`).join('')}</div>`:''}</div>`).join('')
  // Build filter
  const f=document.getElementById('filterRow')
  if(VIEW!=='journal'){const all=[...new Set([...list.map(i=>i.st),...list.map(i=>i.su).filter(Boolean)])].slice(0,15);f.innerHTML=all.map(v=>`<button data-s="${v}">${ST[v]||v}</button>`);f.querySelectorAll('button').forEach(b=>{b.onclick=()=>{f.querySelectorAll('button').forEach(bb=>bb.classList.remove('active'));b.classList.add('active');FIL=b.dataset.s;render()}})}
}

// NAV
document.querySelectorAll('#mainNav button').forEach(b=>{b.onclick=()=>{navigate(b.dataset.v,'all')}})

// DETAIL PANEL
function openDetail(i){
  const item=I[i];if(!item)return
  DETAIL=i
  document.getElementById('detailOverlay').classList.add('show')
  document.getElementById('detailPanel').classList.add('show')
  document.getElementById('detailTitle').textContent=item.ti||'详情'
  renderDetail(item)
}
function closeDetail(){
  document.getElementById('detailOverlay').classList.remove('show')
  document.getElementById('detailPanel').classList.remove('show')
}
function renderDetail(item){
  const info=LB[item.t]||''
  const h=[`<div class="field"><label>类型</label><div class="val">${IC[item.t]||''} ${info}</div></div>`
  ,`<div class="field"><label>标题</label><input value="${es(item.ti||'')}" id="dT"></div>`
  ,`<div class="field"><label>${item.t==='journal'?'内容':'作者'}</label><textarea id="dB" rows="3">${es(item.bo||item.cr||'')}</textarea></div>`]
  if(item.st)h.push(`<div class="field"><label>状态</label><select id="dS"><option value="${item.st}">${ST[item.st]||item.st}</option></select></div>`)
  if(item.ex)h.push(`<div class="field"><label>简介</label><textarea id="dE" rows="2">${es(item.ex)}</textarea></div>`)
  if(item.sb?.length)h.push(`<div class="field"><label>关联课题</label><div class="val">${item.sb.map(s=>`📚${es(s)}`).join(' ')}</div></div>`)
  h.push(`<button class="save-btn" onclick="saveDetail()">💾 保存</button>`)
  document.getElementById('detailBody').innerHTML=h.join('')
}
function saveDetail(){
  const item=I[DETAIL];if(!item)return
  const t=document.getElementById('dT');if(t)item.ti=t.value.trim()
  const b=document.getElementById('dB');if(b){if(item.t==='journal')item.bo=b.value.trim();else item.cr=b.value.trim()}
  const e=document.getElementById('dE');if(e)item.ex=e.value.trim()
  sv();closeDetail();render()
}

// ADD MODAL
function showAdd(mode){
  document.getElementById('addModal').classList.add('show');document.body.style.overflow='hidden'
  if(mode==='ai')showAiImport()
  else showManualForm()
}
function closeAdd(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('addModal').classList.remove('show');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('detailPanel').classList.contains('show'))closeDetail();else if(document.getElementById('addModal').classList.contains('show'))closeAdd()}})
ld();navigate('journal','all')
</script>
